<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Noctis AI — Clean Financial & Habit OS</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #09090d;
      color: #f4f4f6;
      margin: 0;
      padding: 0;
      overflow-x: hidden;
    }

    .clean-card {
      background: rgba(20, 20, 28, 0.75);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.07);
      border-radius: 20px;
      transition: all 0.2s ease;
    }

    .clean-card:hover {
      border-color: rgba(244, 63, 94, 0.25);
    }

    .clean-input {
      background: #12121a;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      color: #ffffff;
      transition: border-color 0.2s ease;
    }
    .clean-input:focus {
      outline: none;
      border-color: #f43f5e;
    }

    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #09090d; }
    ::-webkit-scrollbar-thumb { background: #27273a; border-radius: 9999px; }
  </style>
</head>
<body class="min-h-screen bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-rose-950/20 via-[#09090d] to-[#050507]">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // Classificador Inteligente Automático de Gastos
    const classifyExpense = (desc) => {
      const t = desc.toLowerCase();
      const sup = ['ifood', 'delivery', 'lanche', 'pizza', 'bar', 'festa', 'jogo', 'game', 'streaming', 'netflix', 'shopping', 'roupa', 'doce', 'impulso'];
      const ess = ['aluguel', 'condominio', 'condomínio', 'luz', 'energia', 'agua', 'água', 'internet', 'mercado', 'supermercado', 'feira', 'farmacia', 'saude', 'faculdade', 'curso'];
      if (sup.some(k => t.includes(k))) return 'Supérfluo';
      if (ess.some(k => t.includes(k))) return 'Essencial';
      return 'Variável';
    };

    // Gráfico Clean de Evolução e Marca
    function CleanProjectionChart({ timeline, activeGoal, formatBRL }) {
      const maxVal = Math.max(
        ...timeline.map(d => Math.max(d.cur, d.ai)),
        activeGoal?.targetAmount || 1000,
        500
      ) * 1.15;

      const goalY = activeGoal
        ? Math.max(18, Math.min(165, 170 - (activeGoal.targetAmount / maxVal) * 140))
        : null;

      return (
        <div className="w-full pt-2">
          <div className="flex flex-wrap items-center justify-between gap-2 mb-4">
            <div>
              <h3 className="text-sm font-bold text-white">Projeção de Acúmulo nos Próximos Meses</h3>
              <p className="text-xs text-zinc-400">Calculado a partir do uso real no Mês atual + juros compostos da Renda Fixa</p>
            </div>
            <div className="flex items-center gap-4 text-xs font-medium">
              <span className="flex items-center gap-1.5 text-zinc-300">
                <span className="w-2.5 h-2.5 rounded-full bg-amber-400 inline-block" /> Ritmo Atual
              </span>
              <span className="flex items-center gap-1.5 text-emerald-400">
                <span className="w-2.5 h-2.5 rounded-full bg-emerald-400 inline-block" /> Otimizado pela IA
              </span>
            </div>
          </div>

          <div className="w-full h-56 bg-[#0d0d14] rounded-2xl border border-white/5 p-4">
            <svg viewBox="0 0 700 195" className="w-full h-full overflow-visible">
              {[0, 0.5, 1].map((s, i) => {
                const y = 170 - s * 140;
                const v = Math.round(maxVal * s);
                return (
                  <g key={i}>
                    <line x1="50" y1={y} x2="680" y2={y} stroke="rgba(255,255,255,0.05)" strokeDasharray="4 4" />
                    <text x="44" y={y + 3} textAnchor="end" fill="#71717a" fontSize="9.5">
                      R${v >= 1000 ? `${(v / 1000).toFixed(1)}k` : v}
                    </text>
                  </g>
                );
              })}

              {activeGoal && goalY !== null && (
                <g>
                  <line x1="50" y1={goalY} x2="680" y2={goalY} stroke="#f43f5e" strokeWidth="1.5" strokeDasharray="6 4" />
                  <rect x="545" y={goalY - 15} width="135" height="14" rx="4" fill="#881337" />
                  <text x="612" y={goalY - 5} textAnchor="middle" fill="#ffe4e6" fontSize="8.5" fontWeight="700">
                    Meta: {formatBRL(activeGoal.targetAmount)}
                  </text>
                </g>
              )}

              {timeline.map((item, idx) => {
                const step = 610 / Math.max(1, timeline.length);
                const x = 75 + idx * step;
                const curH = Math.max(4, (item.cur / maxVal) * 140);
                const aiH = Math.max(4, (item.ai / maxVal) * 140);

                return (
                  <g key={idx}>
                    <rect x={x - 14} y={170 - curH} width="12" height={curH} rx="3" fill="#f59e0b" opacity={item.isCurrent ? "1" : "0.65"} />
                    <rect x={x + 2} y={170 - aiH} width="12" height={aiH} rx="3" fill="#10b981" opacity={item.isCurrent ? "1" : "0.85"} />
                    <text x={x} y={Math.max(12, 164 - Math.max(curH, aiH))} textAnchor="middle" fill="#a7f3d0" fontSize="8.5" fontWeight="700">
                      R${item.ai >= 1000 ? `${(item.ai / 1000).toFixed(1)}k` : item.ai}
                    </text>
                    <text x={x} y="188" textAnchor="middle" fill={item.isCurrent ? "#fda4af" : "#a1a1aa"} fontSize="9.5" fontWeight={item.isCurrent ? "700" : "500"}>
                      {item.label}
                    </text>
                  </g>
                );
              })}
            </svg>
          </div>
        </div>
      );
    }

    function App() {
      const load = (k, def) => {
        try { const r = localStorage.getItem(k); return r ? JSON.parse(r) : def; } catch (e) { return def; }
      };

      // Navegação e Modo de Visualização Flexível (Clean vs Detalhado)
      const [activeTab, setActiveTab] = useState('financas'); // 'financas' | 'ia' | 'habitos'
      const [compactMode, setCompactMode] = useState(false);

      // Dados Financeiros (Inicia zerado no Mês 1 e persiste o que o usuário digitar)
      const [monthNum, setMonthNum] = useState(() => load('noctis_clean_month', 1));
      const [closedMonths, setClosedMonths] = useState(() => load('noctis_clean_closed', []));
      const [transactions, setTransactions] = useState(() => load('noctis_clean_txs', []));
      const [goals, setGoals] = useState(() => load('noctis_clean_goals', [
        { id: 1, title: 'Reserva de Segurança', targetAmount: 3000 }
      ]));
      const [selectedGoalId, setSelectedGoalId] = useState(1);
      const [savingsPctGoal, setSavingsPctGoal] = useState(20);

      // Inputs de Transação
      const [txDesc, setTxDesc] = useState('');
      const [txAmount, setTxAmount] = useState('');
      const [txType, setTxType] = useState('income');
      const [txCategory, setTxCategory] = useState('Essencial');
      const [newGoalTitle, setNewGoalTitle] = useState('');
      const [newGoalAmount, setNewGoalAmount] = useState('');

      // Estados do Módulo de Bons Hábitos (Agora 100% editável!)
      const [habits, setHabits] = useState(() => load('noctis_clean_habits', [
        { id: 1, title: 'Separar o valor de poupança ao receber', category: 'Finanças', xp: 50, completed: false },
        { id: 2, title: 'Estudar programação (Python / IA) por 1 hora', category: 'Carreira & TI', xp: 60, completed: false },
        { id: 3, title: 'Dia sem gastos por impulso / delivery', category: 'Economia', xp: 40, completed: false }
      ]));
      const [habitTitle, setHabitTitle] = useState('');
      const [habitCategory, setHabitCategory] = useState('Finanças');
      const [habitXp, setHabitXp] = useState(50);

      // Gamificação Leve
      const [xp, setXp] = useState(() => load('noctis_clean_xp', 40));
      const [level, setLevel] = useState(() => load('noctis_clean_lvl', 1));
      const [streak, setStreak] = useState(() => load('noctis_clean_streak', 1));

      // Simulador de Renda Fixa
      const [investMonths, setInvestMonths] = useState(12);

      // Estados da Chave API (Com Auto-Descoberta e Modo Híbrido que nunca trava)
      const [apiKey, setApiKey] = useState(() => localStorage.getItem('noctis_clean_api_key') || '');
      const [detectedModel, setDetectedModel] = useState(() => localStorage.getItem('noctis_clean_model') || '');
      const [apiMode, setApiMode] = useState(() => localStorage.getItem('noctis_clean_api_key') ? 'ready' : 'local'); // 'local' | 'testing' | 'ready'
      const [apiFeedback, setApiFeedback] = useState('');
      const [showApiBox, setShowApiBox] = useState(false);

      // Chat IA
      const [chatInput, setChatInput] = useState('');
      const [isTyping, setIsTyping] = useState(false);
      const [messages, setMessages] = useState([
        {
          id: 1,
          sender: 'ai',
          text: 'Olá! Agora nossa interface está limpa e direta ao ponto. Posso analisar seus gastos para te ensinar a poupar e simular quanto sua grana guardada rende no Tesouro Selic, CDB e LCI/LCA. O que gostaria de analisar?'
        }
      ]);
      const chatEndRef = useRef(null);

      // Persistência Automática
      useEffect(() => { localStorage.setItem('noctis_clean_month', JSON.stringify(monthNum)); }, [monthNum]);
      useEffect(() => { localStorage.setItem('noctis_clean_closed', JSON.stringify(closedMonths)); }, [closedMonths]);
      useEffect(() => { localStorage.setItem('noctis_clean_txs', JSON.stringify(transactions)); }, [transactions]);
      useEffect(() => { localStorage.setItem('noctis_clean_goals', JSON.stringify(goals)); }, [goals]);
      useEffect(() => { localStorage.setItem('noctis_clean_habits', JSON.stringify(habits)); }, [habits]);
      useEffect(() => { localStorage.setItem('noctis_clean_xp', JSON.stringify(xp)); }, [xp]);
      useEffect(() => { localStorage.setItem('noctis_clean_lvl', JSON.stringify(level)); }, [level]);
      useEffect(() => { localStorage.setItem('noctis_clean_streak', JSON.stringify(streak)); }, [streak]);

      useEffect(() => {
        if (xp >= level * 150) {
          setXp(p => p - level * 150);
          setLevel(l => l + 1);
        }
      }, [xp, level]);

      // Cálculos do Motor Financeiro
      const income = transactions.filter(t => t.type === 'income').reduce((a, b) => a + b.amount, 0);
      const expense = transactions.filter(t => t.type === 'expense').reduce((a, b) => a + b.amount, 0);
      const savedExplicit = transactions.filter(t => t.type === 'saved').reduce((a, b) => a + b.amount, 0);

      const essentialExp = transactions.filter(t => t.type === 'expense' && t.category === 'Essencial').reduce((a, b) => a + b.amount, 0);
      const variableExp = transactions.filter(t => t.type === 'expense' && t.category === 'Variável').reduce((a, b) => a + b.amount, 0);
      const superfluousExp = transactions.filter(t => t.type === 'expense' && t.category === 'Supérfluo').reduce((a, b) => a + b.amount, 0);

      const freeCash = Math.max(0, income - expense - savedExplicit);
      const pastSaved = closedMonths.reduce((a, m) => a + m.saved, 0);
      const totalSaved = pastSaved + savedExplicit;

      // Ritmo atual vs Potencial Otimizado pela IA
      const currentPace = savedExplicit > 0 ? savedExplicit + Math.round(freeCash * 0.5) : Math.max(0, income - expense);
      const cutSuperfluous = Math.round(superfluousExp * 0.5);
      const cutVariable = Math.round(variableExp * 0.15);
      const aiPotentialMonthly = Math.max(
        currentPace,
        savedExplicit + freeCash + cutSuperfluous + cutVariable,
        Math.round((income * savingsPctGoal) / 100)
      );

      // Simulador de Renda Fixa Segura
      const monthlyDeposit = aiPotentialMonthly > 0 ? aiPotentialMonthly : 300;
      const simulateCompound = (principal, monthly, rate, months) => {
        let tot = principal;
        for (let i = 1; i <= months; i++) tot = tot * (1 + rate) + monthly;
        return Math.round(tot);
      };

      const totalOutPocket = totalSaved + monthlyDeposit * investMonths;
      const simPoupanca = simulateCompound(totalSaved, monthlyDeposit, 0.0058, investMonths);
      const simTesouroCdb = simulateCompound(totalSaved, monthlyDeposit, 0.0086, investMonths);
      const simLciLca = simulateCompound(totalSaved, monthlyDeposit, 0.0094, investMonths);

      // Linha do Tempo do Gráfico
      const buildTimeline = () => {
        const arr = [];
        let c = 0;
        let a = 0;
        closedMonths.forEach(m => {
          c += m.saved;
          a += m.saved;
          arr.push({ label: `Mês ${m.monthNum}`, cur: Math.round(c), ai: Math.round(a), isCurrent: false });
        });
        c += currentPace;
        a += aiPotentialMonthly;
        arr.push({ label: `Mês ${monthNum} (Atual)`, cur: Math.round(c), ai: Math.round(a), isCurrent: true });

        let pc = c;
        let pa = a;
        for (let i = 1; i <= 5; i++) {
          pc = pc * 1.0086 + currentPace;
          pa = pa * 1.0094 + aiPotentialMonthly;
          arr.push({ label: `Mês +${i}`, cur: Math.round(pc), ai: Math.round(pa), isCurrent: false });
        }
        return arr;
      };

      const timeline = buildTimeline();
      const activeGoal = goals.find(g => g.id === selectedGoalId) || goals[0];
      const formatBRL = (v) => Number(v || 0).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });

      // 🔑 AUTO-DESCOBERTA INTELIGENTE DE CHAVE API (Resolve o erro de chave não aceita!)
      const handleSaveAndVerifyKey = async () => {
        const cleanKey = apiKey.replace(/["'\s]/g, ''); // Remove espaços e aspas acidentais
        if (!cleanKey) {
          setApiMode('local');
          setApiFeedback('Modo Analítico Local ativado (sem chave externa).');
          return;
        }

        setApiKey(cleanKey);
        localStorage.setItem('noctis_clean_api_key', cleanKey);
        setApiMode('testing');
        setApiFeedback('Verificando chave e buscando modelo compatível...');

        try {
          // 1. Consulta os modelos disponíveis para aquela chave específica
          const listRes = await fetch(`https://generativelanguage.googleapis.com/v1beta/models?key=${cleanKey}`);
          if (listRes.ok) {
            const listData = await listRes.json();
            const availableModels = (listData.models || [])
              .filter(m => (m.supportedGenerationMethods || []).includes('generateContent'))
              .map(m => m.name.replace('models/', ''));

            // Escolhe o melhor modelo flash ou pro disponível na conta do usuário
            const preferred = availableModels.find(m => m.includes('2.5-flash')) ||
                              availableModels.find(m => m.includes('2.0-flash')) ||
                              availableModels.find(m => m.includes('flash')) ||
                              availableModels[0] || 'gemini-2.0-flash';

            setDetectedModel(preferred);
            localStorage.setItem('noctis_clean_model', preferred);
            setApiMode('ready');
            setApiFeedback(`✅ Chave aceita! Modelo detectado automaticamente: ${preferred}`);
            return;
          }
        } catch (err) {
          // Se houver bloqueio de rede/CORS local, ativa em Modo Híbrido para não recusar a chave do usuário!
        }

        // Fallback Híbrido: Aceita a chave e tenta múltiplos endpoints durante o chat
        setDetectedModel('gemini-2.0-flash');
        setApiMode('ready');
        setApiFeedback('✅ Chave salva em Modo Híbrido Inteligente (API + Motor Financeiro Local).');
      };

      // Motor de Resposta Financeira e Dicas de Investimento Seguro
      const generateSmartFinancialReply = (question) => {
        const q = question.toLowerCase();
        if (q.includes('invest') || q.includes('segur') || q.includes('selic') || q.includes('cdb') || q.includes('renda')) {
          return `🛡️ Onde investir sua grana guardada (${formatBRL(totalSaved)}) com segurança máxima:
1. Tesouro Selic ou CDB 100% CDI (Liquidez Diária): Ideal para sua Reserva de Segurança. Seu dinheiro rende todos os dias úteis (~0,86% a.m. livre), tem proteção do FGC/Governo Federal e pode ser resgatado a qualquer momento.
2. LCI / LCA (Isentas de Imposto de Renda): Ideais para multiplicar o dinheiro que você pode deixar guardado por 6 a 12 meses. Como não cobram Imposto de Renda, entregam o maior retorno líquido com risco baixíssimo.
3. Projeção Real: Guardando ${formatBRL(monthlyDeposit)}/mês por ${investMonths} meses, você acumulará ${formatBRL(simLciLca)} (sendo +${formatBRL(simLciLca - totalOutPocket)} só de juros trabalhando por você!).`;
        }

        if (q.includes('poupar') || q.includes('corte') || q.includes('economizar') || q.includes('gasto')) {
          if (income === 0 && expense === 0) {
            return `💡 Como começar a poupar hoje mesmo:
1. Vá na aba "Finanças & Marcas" (ou clique em "Carregar Exemplo" no topo) e registre sua renda e despesas.
2. Aplique a regra "Pague-se Primeiro": separe ${savingsPctGoal}% assim que receber, antes de gastar com lazer ou delivery.`;
          }
          return `✂️ Diagnóstico de Economia no Mês ${monthNum}:
• Receitas: ${formatBRL(income)} | Gastos Totais: ${formatBRL(expense)}.
• Gastos Supérfluos detectados: ${formatBRL(superfluousExp)} | Variáveis: ${formatBRL(variableExp)}.
• Plano Prático: Reduzindo 50% dos supérfluos (+${formatBRL(cutSuperfluous)}) e 15% dos variáveis (+${formatBRL(cutVariable)}), além de guardar seu saldo livre (${formatBRL(freeCash)}), sua capacidade de poupança sobe para ${formatBRL(aiPotentialMonthly)}/mês!`;
        }

        return `📊 Resumo Estratégico: Você possui ${formatBRL(totalSaved)} guardados e potencial para aportar ${formatBRL(aiPotentialMonthly)}/mês. Para atingir sua marca "${activeGoal?.title}" (${formatBRL(activeGoal?.targetAmount)}), mantenha seus aportes em um CDB 100% CDI ou Tesouro Selic.`;
      };

      const sendChatMessage = async (customText) => {
        const text = customText || chatInput;
        if (!text.trim() || isTyping) return;

        setMessages(prev => [...prev, { id: Date.now(), sender: 'user', text }]);
        if (!customText) setChatInput('');
        setIsTyping(true);

        let reply = '';
        const cleanKey = apiKey.replace(/["'\s]/g, '');

        if (cleanKey) {
          const modelsToTry = [detectedModel, 'gemini-2.5-flash', 'gemini-2.0-flash', 'gemini-1.5-flash-latest'].filter(Boolean);
          const prompt = `Você é Noctis, um consultor financeiro pessoal focado em economia inteligente e investimentos seguros no Brasil (Tesouro Selic, CDB 100% CDI com FGC, LCI/LCA).
Dados reais do usuário no Mês ${monthNum}: Ganhos=${formatBRL(income)}, Gastos=${formatBRL(expense)} (Essenciais=${formatBRL(essentialExp)}, Variáveis=${formatBRL(variableExp)}, Supérfluos=${formatBRL(superfluousExp)}), Guardado=${formatBRL(totalSaved)}, Potencial Mensal IA=${formatBRL(aiPotentialMonthly)}/mês, Meta="${activeGoal?.title}" (${formatBRL(activeGoal?.targetAmount)}).
Responda em português, de forma clara, objetiva (máximo 3 parágrafos curtos) e prática.
Pergunta: ${text}`;

          for (const mod of modelsToTry) {
            try {
              const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${mod}:generateContent?key=${cleanKey}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
              });
              if (res.ok) {
                const data = await res.json();
                const candidate = data?.candidates?.[0]?.content?.parts?.[0]?.text;
                if (candidate) {
                  reply = candidate;
                  break;
                }
              }
            } catch (e) {}
          }
        }

        if (!reply) {
          await new Promise(r => setTimeout(r, 450));
          reply = generateSmartFinancialReply(text);
        }

        setMessages(prev => [...prev, { id: Date.now() + 1, sender: 'ai', text: reply }]);
        setIsTyping(false);
        setXp(p => p + 15);
        setTimeout(() => chatEndRef.current?.scrollIntoView({ behavior: 'smooth' }), 100);
      };

      // Adicionar Transação
      const handleAddTx = (e) => {
        e.preventDefault();
        const val = parseFloat(String(txAmount).replace(',', '.'));
        if (!txDesc.trim() || isNaN(val) || val <= 0) return;

        const cat = txType === 'income' ? 'Renda' : txType === 'saved' ? 'Cofre' : txCategory;
        setTransactions([{ id: Date.now(), desc: txDesc.trim(), amount: val, type: txType, category: cat }, ...transactions]);
        setXp(p => p + 25);
        setTxDesc('');
        setTxAmount('');
      };

      // Adicionar Novo Hábito (Módulo de Bons Hábitos Consertado!)
      const handleAddHabit = (e) => {
        e.preventDefault();
        if (!habitTitle.trim()) return;
        const newH = {
          id: Date.now(),
          title: habitTitle.trim(),
          category: habitCategory,
          xp: Number(habitXp) || 50,
          completed: false
        };
        setHabits([newH, ...habits]);
        setHabitTitle('');
      };

      const completedHabits = habits.filter(h => h.completed).length;
      const habitsPct = habits.length > 0 ? Math.round((completedHabits / habits.length) * 100) : 0;

      return (
        <div className="min-h-screen flex flex-col">
          
          {/* BARRA SUPERIOR CLEAN & FLEXÍVEL */}
          <header className="border-b border-white/10 bg-[#0c0c12]/90 backdrop-blur-md sticky top-0 z-30">
            <div className="max-w-5xl mx-auto px-4 sm:px-6 py-3.5 flex flex-wrap items-center justify-between gap-4">
              
              {/* Logo + Nível */}
              <div className="flex items-center gap-3">
                <div className="w-9 h-9 rounded-xl bg-gradient-to-br from-rose-500 to-rose-700 flex items-center justify-center font-extrabold text-white shadow-lg shadow-rose-950/50">
                  N
                </div>
                <div>
                  <div className="flex items-center gap-2">
                    <span className="font-bold text-sm tracking-wide text-white">NOCTIS AI</span>
                    <span className="text-[11px] font-bold px-2 py-0.5 rounded-full bg-rose-500/15 text-rose-300 border border-rose-500/30">
                      Nv. {level} • {xp}/{level * 150} XP
                    </span>
                  </div>
                  <p className="text-[11px] text-zinc-400">Mês {monthNum} • 🔥 {streak} dias de foco</p>
                </div>
              </div>

              {/* Navegação Central Clean (Apenas 3 Abas Claras) */}
              <nav className="flex items-center gap-1.5 bg-[#14141f] p-1.5 rounded-2xl border border-white/5">
                {[
                  { id: 'financas', label: '📊 Finanças & Marcas' },
                  { id: 'ia', label: '🧠 IA & Investimentos' },
                  { id: 'habitos', label: `🎯 Bons Hábitos (${completedHabits}/${habits.length})` }
                ].map(t => (
                  <button
                    key={t.id}
                    onClick={() => setActiveTab(t.id)}
                    className={`px-4 py-2 rounded-xl text-xs font-bold transition-all ${
                      activeTab === t.id
                        ? 'bg-rose-600 text-white shadow-md'
                        : 'text-zinc-400 hover:text-white'
                    }`}
                  >
                    {t.label}
                  </button>
                ))}
              </nav>

              {/* Controles de Layout Flexível & Chave API */}
              <div className="flex items-center gap-2">
                <button
                  onClick={() => setCompactMode(!compactMode)}
                  className="px-3 py-1.5 rounded-xl bg-white/5 hover:bg-white/10 text-zinc-300 text-xs font-semibold border border-white/10 transition"
                  title="Alternar entre Modo Foco (Clean) e Modo Detalhado"
                >
                  {compactMode ? '👁️ Expandir' : '✨ Modo Clean'}
                </button>
                <button
                  onClick={() => setShowApiBox(!showApiBox)}
                  className={`px-3 py-1.5 rounded-xl text-xs font-bold border transition ${
                    apiMode === 'ready'
                      ? 'bg-emerald-500/15 text-emerald-300 border-emerald-500/30'
                      : 'bg-amber-500/15 text-amber-300 border-amber-500/30'
                  }`}
                >
                  🔑 {apiMode === 'ready' ? 'API Ativa ✓' : 'Chave API'}
                </button>
              </div>
            </div>

            {/* Gaveta de Configuração da Chave API (Com Auto-Detecção) */}
            {showApiBox && (
              <div className="border-t border-white/10 bg-[#12121c] px-6 py-4">
                <div className="max-w-5xl mx-auto space-y-2.5">
                  <div className="flex items-center justify-between">
                    <span className="text-xs font-bold text-amber-300">
                      🔑 Configurar Chave Gratuita do Google AI Studio (Auto-Detecção de Modelo)
                    </span>
                    <button onClick={() => setShowApiBox(false)} className="text-xs text-zinc-400 hover:text-white">Fechar ✕</button>
                  </div>
                  <div className="flex flex-wrap gap-2">
                    <input
                      type="password"
                      placeholder="Cole sua chave AIzaSy... aqui (espaços extras são removidos automaticamente)"
                      value={apiKey}
                      onChange={e => setApiKey(e.target.value)}
                      className="clean-input flex-1 min-w-[260px] px-3.5 py-2 text-xs"
                    />
                    <button
                      onClick={handleSaveAndVerifyKey}
                      className="bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-xs px-5 py-2 rounded-xl transition"
                    >
                      {apiMode === 'testing' ? 'Validando...' : 'Salvar e Ativar Chave'}
                    </button>
                  </div>
                  {apiFeedback && (
                    <p className="text-xs text-emerald-300 font-medium">{apiFeedback}</p>
                  )}
                </div>
              </div>
            )}
          </header>

          {/* CONTEÚDO CENTRALIZADO, LIMPO E COM ESPAÇO DE RESPIRO */}
          <main className="flex-1 max-w-5xl w-full mx-auto px-4 sm:px-6 py-6 space-y-6">

            {/* =========================================================
                ABA 1: FINANÇAS & MARCAS (LAYOUT CLEAN)
               ========================================================= */}
            {activeTab === 'financas' && (
              <div className="space-y-6">
                
                {/* 3 Cartões Principais Limpos */}
                <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                  <div className="clean-card p-5">
                    <span className="text-xs font-semibold text-zinc-400">Ganhos no Mês {monthNum}</span>
                    <div className="text-2xl font-extrabold text-emerald-400 mt-1">{formatBRL(income)}</div>
                    <p className="text-xs text-zinc-500 mt-1">Gastos registrados: {formatBRL(expense)}</p>
                  </div>

                  <div className="clean-card p-5">
                    <span className="text-xs font-semibold text-zinc-400">Grana Guardada no Cofre</span>
                    <div className="text-2xl font-extrabold text-amber-300 mt-1">{formatBRL(totalSaved)}</div>
                    <p className="text-xs text-zinc-500 mt-1">Saldo livre atual: {formatBRL(freeCash)}</p>
                  </div>

                  <div className="clean-card p-5 border-emerald-500/30 bg-emerald-950/10">
                    <span className="text-xs font-semibold text-emerald-300">Potencial de Poupança (IA)</span>
                    <div className="text-2xl font-extrabold text-white mt-1">
                      {formatBRL(aiPotentialMonthly)}<span className="text-xs font-normal text-zinc-400">/mês</span>
                    </div>
                    <p className="text-xs text-emerald-300/80 mt-1">
                      Economia extra possível: +{formatBRL(cutSuperfluous + cutVariable)}
                    </p>
                  </div>
                </div>

                {/* Barra Rápida para Adicionar Ganho, Gasto ou Valor Guardado */}
                <div className="clean-card p-5">
                  <div className="flex flex-wrap items-center justify-between gap-2 mb-3">
                    <h3 className="text-sm font-bold text-white">Novo Lançamento Financeiro</h3>
                    <div className="flex gap-2">
                      {transactions.length === 0 && (
                        <button
                          onClick={() => setTransactions([
                            { id: 1, desc: 'Salário / Renda', amount: 4000, type: 'income', category: 'Renda' },
                            { id: 2, desc: 'Aluguel + Contas Fixas', amount: 1500, type: 'expense', category: 'Essencial' },
                            { id: 3, desc: 'Supermercado', amount: 650, type: 'expense', category: 'Essencial' },
                            { id: 4, desc: 'iFood & Lanches', amount: 450, type: 'expense', category: 'Supérfluo' },
                            { id: 5, desc: 'Guardado no Tesouro Selic', amount: 500, type: 'saved', category: 'Cofre' }
                          ])}
                          className="text-xs text-emerald-400 hover:underline font-semibold"
                        >
                          🧪 Preencher Exemplo
                        </button>
                      )}
                      {transactions.length > 0 && (
                        <button
                          onClick={() => {
                            setClosedMonths([...closedMonths, { monthNum, income, expense, saved: currentPace }]);
                            setMonthNum(m => m + 1);
                            setTransactions([]);
                          }}
                          className="text-xs text-amber-300 hover:underline font-semibold"
                        >
                          📅 Fechar Mês {monthNum} e Avançar
                        </button>
                      )}
                    </div>
                  </div>

                  <form onSubmit={handleAddTx} className="flex flex-col sm:flex-row gap-2.5">
                    <div className="flex bg-[#12121a] p-1 rounded-xl border border-white/10 shrink-0">
                      {[
                        { id: 'income', label: '+ Ganhei', color: 'bg-emerald-600 text-white' },
                        { id: 'expense', label: '- Gastei', color: 'bg-rose-600 text-white' },
                        { id: 'saved', label: '♦ Guardei', color: 'bg-amber-500 text-zinc-950' }
                      ].map(b => (
                        <button
                          key={b.id}
                          type="button"
                          onClick={() => setTxType(b.id)}
                          className={`px-3 py-1.5 rounded-lg text-xs font-bold transition ${
                            txType === b.id ? b.color : 'text-zinc-400 hover:text-white'
                          }`}
                        >
                          {b.label}
                        </button>
                      ))}
                    </div>

                    <input
                      type="text"
                      placeholder="Descrição (Ex: Salário, Aluguel, iFood...)"
                      value={txDesc}
                      onChange={e => {
                        setTxDesc(e.target.value);
                        if (txType === 'expense') setTxCategory(classifyExpense(e.target.value));
                      }}
                      className="clean-input flex-1 px-3.5 py-2 text-xs"
                    />

                    <input
                      type="number"
                      step="0.01"
                      placeholder="R$ Valor"
                      value={txAmount}
                      onChange={e => setTxAmount(e.target.value)}
                      className="clean-input w-full sm:w-28 px-3.5 py-2 text-xs"
                    />

                    {txType === 'expense' && (
                      <select
                        value={txCategory}
                        onChange={e => setTxCategory(e.target.value)}
                        className="clean-input px-3 py-2 text-xs"
                      >
                        <option value="Essencial">Essencial</option>
                        <option value="Variável">Variável</option>
                        <option value="Supérfluo">Supérfluo</option>
                      </select>
                    )}

                    <button
                      type="submit"
                      className="bg-rose-600 hover:bg-rose-500 text-white font-bold text-xs px-5 py-2 rounded-xl transition shrink-0"
                    >
                      Adicionar
                    </button>
                  </form>
                </div>

                {/* Gráfico Clean + Marcas (Pode ser ocultado no Modo Compacto se o usuário quiser ainda mais simplicidade) */}
                <div className="clean-card p-5 space-y-4">
                  <CleanProjectionChart timeline={timeline} activeGoal={activeGoal} formatBRL={formatBRL} />

                  <div className="pt-3 border-t border-white/10 flex flex-wrap items-center justify-between gap-3">
                    <div className="flex flex-wrap items-center gap-2">
                      <span className="text-xs font-semibold text-zinc-400">🎯 Meta no Gráfico:</span>
                      {goals.map(g => (
                        <button
                          key={g.id}
                          onClick={() => setSelectedGoalId(g.id)}
                          className={`px-3 py-1 rounded-lg text-xs font-bold border transition ${
                            selectedGoalId === g.id
                              ? 'bg-rose-600 text-white border-rose-400'
                              : 'bg-[#12121a] text-zinc-400 border-white/10'
                          }`}
                        >
                          {g.title}: {formatBRL(g.targetAmount)}
                        </button>
                      ))}
                    </div>

                    <form
                      onSubmit={e => {
                        e.preventDefault();
                        const v = parseFloat(String(newGoalAmount).replace(',', '.'));
                        if (!newGoalTitle.trim() || isNaN(v) || v <= 0) return;
                        const ng = { id: Date.now(), title: newGoalTitle.trim(), targetAmount: v };
                        setGoals([...goals, ng]);
                        setSelectedGoalId(ng.id);
                        setNewGoalTitle('');
                        setNewGoalAmount('');
                      }}
                      className="flex gap-2"
                    >
                      <input
                        type="text"
                        placeholder="Nova meta (ex: Viagem)..."
                        value={newGoalTitle}
                        onChange={e => setNewGoalTitle(e.target.value)}
                        className="clean-input px-3 py-1.5 text-xs"
                      />
                      <input
                        type="number"
                        placeholder="R$ Alvo"
                        value={newGoalAmount}
                        onChange={e => setNewGoalAmount(e.target.value)}
                        className="clean-input w-24 px-3 py-1.5 text-xs"
                      />
                      <button type="submit" className="bg-white/10 hover:bg-white/15 text-white text-xs font-bold px-3 py-1.5 rounded-xl">
                        + Meta
                      </button>
                    </form>
                  </div>
                </div>

                {/* Lista Limpa de Lançamentos (Ocultável no Modo Clean/Compacto) */}
                {!compactMode && transactions.length > 0 && (
                  <div className="clean-card p-5">
                    <div className="flex items-center justify-between mb-3">
                      <h3 className="text-sm font-bold text-white">Histórico do Mês {monthNum}</h3>
                      <button
                        onClick={() => setTransactions([])}
                        className="text-xs text-zinc-500 hover:text-rose-400"
                      >
                        Limpar lista
                      </button>
                    </div>
                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-2.5 max-h-60 overflow-y-auto pr-1">
                      {transactions.map(tx => (
                        <div key={tx.id} className="p-3 rounded-xl bg-[#12121a] border border-white/5 flex items-center justify-between">
                          <div className="truncate pr-2">
                            <div className="text-xs font-bold text-white truncate">{tx.desc}</div>
                            <span className="text-[10px] text-zinc-400">{tx.category}</span>
                          </div>
                          <div className="flex items-center gap-2.5 shrink-0">
                            <span className={`text-xs font-extrabold ${
                              tx.type === 'income' ? 'text-emerald-400' : tx.type === 'saved' ? 'text-amber-300' : 'text-rose-400'
                            }`}>
                              {tx.type === 'expense' ? '-' : '+'}{formatBRL(tx.amount)}
                            </span>
                            <button
                              onClick={() => setTransactions(transactions.filter(i => i.id !== tx.id))}
                              className="text-zinc-600 hover:text-rose-400 text-xs"
                            >
                              ✕
                            </button>
                          </div>
                        </div>
                      ))}
                    </div>
                  </div>
                )}

              </div>
            )}

            {/* =========================================================
                ABA 2: CONSULTOR IA & INVESTIMENTOS SEGUROS (CLEAN)
               ========================================================= */}
            {activeTab === 'ia' && (
              <div className="space-y-6">
                
                {/* Simulador Clean de Investimentos Seguros */}
                <div className="clean-card p-5 space-y-4">
                  <div className="flex flex-wrap items-center justify-between gap-3">
                    <div>
                      <h3 className="text-sm font-bold text-white">🛡️ Simulador de Investimentos Seguros (Renda Fixa)</h3>
                      <p className="text-xs text-zinc-400">
                        Veja quanto sua grana guardada ({formatBRL(totalSaved)}) + aporte de {formatBRL(monthlyDeposit)}/mês rende com segurança:
                      </p>
                    </div>
                    <div className="flex gap-1 bg-[#12121a] p-1 rounded-xl border border-white/10">
                      {[6, 12, 24, 36].map(m => (
                        <button
                          key={m}
                          onClick={() => setInvestMonths(m)}
                          className={`px-3 py-1 rounded-lg text-xs font-bold transition ${
                            investMonths === m ? 'bg-emerald-600 text-white' : 'text-zinc-400 hover:text-white'
                          }`}
                        >
                          {m} meses
                        </button>
                      ))}
                    </div>
                  </div>

                  <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <div className="p-4 rounded-2xl bg-[#12121a] border border-white/5">
                      <span className="text-xs font-semibold text-zinc-400 block">1. Poupança Comum</span>
                      <div className="text-xl font-extrabold text-zinc-200 mt-1">{formatBRL(simPoupanca)}</div>
                      <span className="text-[11px] text-amber-300 mt-1 block">
                        Lucro de juros: +{formatBRL(Math.max(0, simPoupanca - totalOutPocket))}
                      </span>
                    </div>

                    <div className="p-4 rounded-2xl bg-[#12121a] border border-sky-500/30">
                      <span className="text-xs font-semibold text-sky-400 block">2. Tesouro Selic / CDB 100% CDI</span>
                      <div className="text-xl font-extrabold text-white mt-1">{formatBRL(simTesouroCdb)}</div>
                      <span className="text-[11px] text-sky-300 mt-1 block">
                        Lucro líquido: +{formatBRL(Math.max(0, simTesouroCdb - totalOutPocket))} (Liquidez Diária)
                      </span>
                    </div>

                    <div className="p-4 rounded-2xl bg-emerald-950/20 border border-emerald-500/40">
                      <span className="text-xs font-semibold text-emerald-300 block">3. LCI / LCA (Isento de IR + FGC)</span>
                      <div className="text-xl font-extrabold text-emerald-400 mt-1">{formatBRL(simLciLca)}</div>
                      <span className="text-[11px] text-emerald-200 mt-1 block">
                        Lucro livre de IR: +{formatBRL(Math.max(0, simLciLca - totalOutPocket))}
                      </span>
                    </div>
                  </div>
                </div>

                {/* Chat Clean com o Analisador Financeiro IA */}
                <div className="clean-card p-5 flex flex-col h-[430px]">
                  <div className="flex flex-wrap items-center justify-between gap-2 pb-3 border-b border-white/10">
                    <div className="flex items-center gap-2">
                      <span className="text-base">🧛</span>
                      <div>
                        <h3 className="text-sm font-bold text-white">Mentor Financeiro Noctis AI</h3>
                        <p className="text-[11px] text-zinc-400">Clique em uma pergunta rápida abaixo ou digite sua dúvida</p>
                      </div>
                    </div>

                    <div className="flex flex-wrap gap-1.5">
                      {[
                        { label: '🛡️ Como investir com segurança?', q: 'Onde devo investir minha grana guardada com segurança total?' },
                        { label: '✂️ Onde cortar gastos?', q: 'Analise meus gastos e me ensine como poupar mais este mês' },
                        { label: '📈 Plano de 12 meses', q: 'Monte um plano de 12 meses para multiplicar minha reserva' }
                      ].map((btn, i) => (
                        <button
                          key={i}
                          onClick={() => sendChatMessage(btn.q)}
                          className="px-3 py-1 rounded-xl bg-white/5 hover:bg-rose-500/20 text-zinc-200 text-xs font-semibold border border-white/10 transition"
                        >
                          {btn.label}
                        </button>
                      ))}
                    </div>
                  </div>

                  <div className="flex-1 overflow-y-auto py-4 space-y-3 pr-1">
                    {messages.map(m => (
                      <div
                        key={m.id}
                        className={`p-3.5 rounded-2xl text-xs leading-relaxed whitespace-pre-line max-w-2xl ${
                          m.sender === 'ai'
                            ? 'bg-[#12121a] border border-white/10 text-zinc-200 mr-auto'
                            : 'bg-rose-600 text-white ml-auto'
                        }`}
                      >
                        {m.text}
                      </div>
                    ))}
                    {isTyping && (
                      <div className="text-xs text-rose-400 animate-pulse font-semibold">
                        Noctis AI está analisando seus números...
                      </div>
                    )}
                    <div ref={chatEndRef} />
                  </div>

                  <form
                    onSubmit={e => { e.preventDefault(); sendChatMessage(); }}
                    className="pt-3 border-t border-white/10 flex gap-2"
                  >
                    <input
                      type="text"
                      placeholder="Pergunte sobre Tesouro Selic, CDB, cortes de orçamento ou metas..."
                      value={chatInput}
                      onChange={e => setChatInput(e.target.value)}
                      className="clean-input flex-1 px-4 py-2.5 text-xs"
                    />
                    <button
                      type="submit"
                      className="bg-rose-600 hover:bg-rose-500 text-white font-bold text-xs px-6 py-2.5 rounded-xl transition"
                    >
                      Perguntar
                    </button>
                  </form>
                </div>

              </div>
            )}

            {/* =========================================================
                ABA 3: MÓDULO DE BONS HÁBITOS (100% CONSERTADO E CLEAN!)
               ========================================================= */}
            {activeTab === 'habitos' && (
              <div className="space-y-6">
                
                {/* Cabeçalho de Progresso dos Hábitos */}
                <div className="clean-card p-5 flex flex-wrap items-center justify-between gap-4">
                  <div>
                    <h3 className="text-base font-bold text-white">Seus Bons Hábitos & Rituais Diários</h3>
                    <p className="text-xs text-zinc-400">
                      Conclua seus hábitos para ganhar XP, subir de nível e manter sua disciplina financeira
                    </p>
                  </div>
                  <div className="flex items-center gap-4">
                    <div className="text-right">
                      <span className="text-xs font-bold text-emerald-400 block">
                        {completedHabits} de {habits.length} concluídos ({habitsPct}%)
                      </span>
                      <div className="w-40 h-2 bg-[#12121a] rounded-full overflow-hidden mt-1 border border-white/10">
                        <div className="h-full bg-emerald-500 transition-all duration-300" style={{ width: `${habitsPct}%` }} />
                      </div>
                    </div>
                    <button
                      onClick={() => {
                        setHabits(habits.map(h => ({ ...h, completed: false })));
                        setStreak(s => s + 1);
                      }}
                      className="px-3.5 py-2 rounded-xl bg-white/5 hover:bg-white/10 text-xs font-bold text-amber-300 border border-white/10 transition"
                    >
                      🌙 Novo Dia (+1 🔥)
                    </button>
                  </div>
                </div>

                {/* Formulário para Adicionar Novos Hábitos (Corrigido!) */}
                <div className="clean-card p-5">
                  <h4 className="text-xs font-bold uppercase tracking-wider text-zinc-400 mb-3">
                    ➕ Adicionar Novo Hábito
                  </h4>
                  <form onSubmit={handleAddHabit} className="flex flex-col sm:flex-row gap-2.5">
                    <input
                      type="text"
                      placeholder="Digite o novo hábito (ex: Poupar R$ 20, Estudar IA, Ler 10 páginas)..."
                      value={habitTitle}
                      onChange={e => setHabitTitle(e.target.value)}
                      className="clean-input flex-1 px-4 py-2.5 text-xs"
                    />
                    <select
                      value={habitCategory}
                      onChange={e => setHabitCategory(e.target.value)}
                      className="clean-input px-3.5 py-2.5 text-xs"
                    >
                      <option value="Finanças">💰 Finanças</option>
                      <option value="Carreira & TI">💻 Carreira & TI</option>
                      <option value="Economia">🛡️ Economia</option>
                      <option value="Saúde & Rotina">⚡ Saúde & Rotina</option>
                    </select>
                    <select
                      value={habitXp}
                      onChange={e => setHabitXp(Number(e.target.value))}
                      className="clean-input px-3.5 py-2.5 text-xs"
                    >
                      <option value={30}>Fácil (+30 XP)</option>
                      <option value={50}>Médio (+50 XP)</option>
                      <option value={80}>Difícil (+80 XP)</option>
                    </select>
                    <button
                      type="submit"
                      className="bg-rose-600 hover:bg-rose-500 text-white font-bold text-xs px-6 py-2.5 rounded-xl transition shrink-0"
                    >
                      + Adicionar Hábito
                    </button>
                  </form>
                </div>

                {/* Lista de Hábitos Interativa */}
                <div className="space-y-2.5">
                  {habits.map(h => (
                    <div
                      key={h.id}
                      className={`clean-card p-4 flex items-center justify-between gap-4 ${
                        h.completed ? 'opacity-60 bg-[#12121a]/50' : ''
                      }`}
                    >
                      <div className="flex items-center gap-3.5 min-w-0">
                        <button
                          onClick={() => {
                            const next = !h.completed;
                            setHabits(habits.map(item => item.id === h.id ? { ...item, completed: next } : item));
                            if (next) setXp(p => p + h.xp);
                          }}
                          className={`w-9 h-9 rounded-xl font-bold text-sm flex items-center justify-center transition shrink-0 ${
                            h.completed
                              ? 'bg-emerald-500 text-zinc-950 shadow'
                              : 'bg-[#12121a] text-zinc-400 border border-white/15 hover:border-rose-500 hover:text-white'
                          }`}
                        >
                          {h.completed ? '✓' : ''}
                        </button>
                        <div className="truncate">
                          <div className={`text-sm font-bold truncate ${h.completed ? 'line-through text-zinc-500' : 'text-white'}`}>
                            {h.title}
                          </div>
                          <div className="flex items-center gap-2 mt-0.5">
                            <span className="text-[10px] font-semibold px-2 py-0.5 rounded bg-white/5 text-zinc-400">
                              {h.category}
                            </span>
                            <span className="text-[11px] font-bold text-rose-400">+{h.xp} XP</span>
                          </div>
                        </div>
                      </div>

                      <button
                        onClick={() => setHabits(habits.filter(item => item.id !== h.id))}
                        className="text-zinc-500 hover:text-rose-400 text-xs px-2 py-1 transition"
                        title="Excluir hábito"
                      >
                        🗑️
                      </button>
                    </div>
                  ))}
                </div>

              </div>
            )}

          </main>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
