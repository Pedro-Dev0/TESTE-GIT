<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Noctis AI — Turbo Streaming Edition (Zero-Scroll PC)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #06060a;
      color: #f8fafc;
      user-select: none;
      -webkit-user-select: none;
      overflow: hidden;
    }
    .font-display { font-family: 'Cinzel', serif; }

    .glass-panel {
      background: rgba(13, 13, 20, 0.92);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.07);
    }
    .glass-card {
      background: rgba(20, 20, 30, 0.76);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.07);
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .glass-card:hover {
      border-color: rgba(244, 63, 94, 0.35);
    }

    @keyframes floatAvatar { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-4px); } }
    @keyframes spinSlow { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    @keyframes blinkCursor { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
    .anim-float { animation: floatAvatar 4s ease-in-out infinite; }
    .anim-spin { animation: spinSlow 24s linear infinite; }
    .stream-cursor { display: inline-block; width: 6px; height: 13px; background: #f43f5e; margin-left: 4px; vertical-align: middle; animation: blinkCursor 0.7s infinite; }

    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(244, 63, 94, 0.3); border-radius: 9999px; }
  </style>
</head>
<body class="h-screen w-screen overflow-hidden bg-[radial-gradient(ellipse_at_top_right,_var(--tw-gradient-stops))] from-rose-950/25 via-[#07070c] to-[#040407]">
  <div id="root" class="h-full w-full"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // 🔊 Efeitos Sonoros Leves
    const playSound = (type, muted) => {
      if (muted) return;
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const now = ctx.currentTime;
        const tone = (freq, start, dur, wave = 'sine', vol = 0.04) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = wave;
          osc.frequency.setValueAtTime(freq, now + start);
          gain.gain.setValueAtTime(vol, now + start);
          gain.gain.exponentialRampToValueAtTime(0.0001, now + start + dur);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(now + start);
          osc.stop(now + start + dur);
        };
        if (type === 'coin') { tone(587.33, 0, 0.08); tone(880, 0.06, 0.18); }
        else if (type === 'success') { tone(523.25, 0, 0.09); tone(659.25, 0.07, 0.2); }
        else if (type === 'click') { tone(540, 0, 0.03); }
      } catch (e) {}
    };

    // Classificador Automático de Categoria de Gastos
    const autoClassifyExpense = (description) => {
      const text = description.toLowerCase();
      const superfluous = ['ifood', 'delivery', 'lanche', 'pizza', 'bar', 'festa', 'jogo', 'game', 'steam', 'streaming', 'netflix', 'shopping', 'roupa', 'doce', 'cerveja', 'impulso', 'uber eats'];
      const essential = ['aluguel', 'condominio', 'condomínio', 'luz', 'energia', 'agua', 'água', 'internet', 'mercado', 'supermercado', 'feira', 'farmacia', 'farmácia', 'saude', 'saúde', 'faculdade', 'curso', 'imposto', 'iptu'];
      if (superfluous.some(k => text.includes(k))) return 'Supérfluo';
      if (essential.some(k => text.includes(k))) return 'Essencial';
      return 'Variável';
    };

    // 🧛‍♂️ Avatar do Lorde Noctis
    function NoctisAvatar({ isAnalyzing }) {
      const auraColor = '#f43f5e';
      return (
        <div className="relative w-20 h-20 mx-auto flex items-center justify-center">
          <div className="absolute inset-0 rounded-full blur-xl opacity-45" style={{ background: `radial-gradient(circle, ${auraColor} 0%, transparent 70%)` }} />
          <svg viewBox="0 0 140 140" className="absolute inset-0 w-full h-full anim-spin opacity-60">
            <circle cx="70" cy="70" r="64" fill="none" stroke={auraColor} strokeWidth="1.5" strokeDasharray="14 10" />
            <circle cx="70" cy="6" r="3" fill={auraColor} />
          </svg>
          <div className="relative w-16 h-16 rounded-full overflow-hidden border-2 border-white/15 anim-float shadow-xl bg-[#090910]">
            <svg viewBox="0 0 120 120" className="w-full h-full">
              <circle cx="60" cy="52" r="34" fill={auraColor} opacity="0.2" />
              <path d="M 15 120 L 28 74 L 45 92 L 60 85 L 75 92 L 92 74 L 105 120 Z" fill="#14141f" />
              <path d="M 28 74 L 46 120 L 34 120 Z" fill={auraColor} opacity="0.85" />
              <path d="M 92 74 L 74 120 L 86 120 Z" fill={auraColor} opacity="0.85" />
              <polygon points="60,92 65,98 60,104 55,98" fill={auraColor} />
              <path d="M 40 42 C 40 26 80 26 80 42 C 80 64 68 78 60 82 C 52 78 40 64 40 42 Z" fill="#e2e8f0" />
              <path d="M 36 48 C 34 25 50 18 60 18 C 72 18 86 25 84 48 C 81 36 74 30 66 34 C 62 28 52 30 46 38 C 42 35 38 40 36 48 Z" fill="#1e293b" />
              <path d="M 38 42 C 42 26 56 22 68 24 C 58 28 48 34 44 45 Z" fill="#f8fafc" opacity="0.85" />
              <path d="M 45 51 Q 50 48 56 52 Q 50 55 45 51 Z" fill="#09090f" />
              <circle cx="50.5" cy="51.5" r="2.4" fill={auraColor} />
              <path d="M 64 52 Q 70 48 75 51 Q 70 55 64 52 Z" fill="#09090f" />
              <circle cx="69.5" cy="51.5" r="2.4" fill={auraColor} />
              {isAnalyzing ? (
                <path d="M 54 67 Q 60 72 66 67 Q 60 75 54 67 Z" fill="#881337" />
              ) : (
                <path d="M 55 68 Q 60 70.5 65 68" fill="none" stroke="#475569" strokeWidth="1.6" strokeLinecap="round" />
              )}
            </svg>
          </div>
        </div>
      );
    }

    // 📈 Gráfico Compacto Zero-Scroll
    function CompactProjectionChart({ timelineData, activeGoal, formatBRL }) {
      const maxDataVal = Math.max(
        ...timelineData.map(d => Math.max(d.cumulativeCurrent, d.cumulativeAi)),
        activeGoal?.targetAmount || 1000,
        500
      ) * 1.15;

      const goalY = activeGoal
        ? Math.max(16, Math.min(142, 145 - (activeGoal.targetAmount / maxDataVal) * 120))
        : null;

      return (
        <div className="w-full h-44 bg-zinc-950/80 rounded-2xl border border-white/10 p-3">
          <svg viewBox="0 0 680 168" className="w-full h-full overflow-visible">
            {[0, 0.5, 1].map((step, i) => {
              const y = 145 - step * 120;
              const val = Math.round(maxDataVal * step);
              return (
                <g key={i}>
                  <line x1="48" y1={y} x2="660" y2={y} stroke="rgba(255,255,255,0.06)" strokeDasharray="4 4" />
                  <text x="42" y={y + 3} textAnchor="end" fill="#71717a" fontSize="9" fontWeight="600">
                    R${val >= 1000 ? `${(val / 1000).toFixed(1)}k` : val}
                  </text>
                </g>
              );
            })}

            {activeGoal && goalY !== null && (
              <g>
                <line x1="48" y1={goalY} x2="660" y2={goalY} stroke="#f43f5e" strokeWidth="1.5" strokeDasharray="5 3" />
                <rect x="520" y={goalY - 14} width="140" height="13" rx="3" fill="#881337" />
                <text x="590" y={goalY - 5} textAnchor="middle" fill="#fecdd3" fontSize="8" fontWeight="800">
                  🎯 {activeGoal.title}: {formatBRL(activeGoal.targetAmount)}
                </text>
              </g>
            )}

            {timelineData.map((item, idx) => {
              const stepWidth = 590 / Math.max(1, timelineData.length);
              const groupX = 70 + idx * stepWidth;
              const curBarH = Math.max(3, (item.cumulativeCurrent / maxDataVal) * 120);
              const aiBarH = Math.max(3, (item.cumulativeAi / maxDataVal) * 120);

              return (
                <g key={idx}>
                  <rect x={groupX - 13} y={145 - curBarH} width="11" height={curBarH} rx="2.5" fill={item.isCurrent ? "#f59e0b" : "#f59e0b88"} />
                  <rect x={groupX + 1} y={145 - aiBarH} width="11" height={aiBarH} rx="2.5" fill={item.isCurrent ? "#10b981" : "#10b98199"} />
                  <text x={groupX} y={Math.max(10, 140 - Math.max(curBarH, aiBarH))} textAnchor="middle" fill="#a7f3d0" fontSize="8" fontWeight="700">
                    R${item.cumulativeAi >= 1000 ? `${(item.cumulativeAi / 1000).toFixed(1)}k` : item.cumulativeAi}
                  </text>
                  <text x={groupX} y="161" textAnchor="middle" fill={item.isCurrent ? "#fda4af" : "#a1a1aa"} fontSize="9" fontWeight={item.isCurrent ? "800" : "600"}>
                    {item.label}
                  </text>
                </g>
              );
            })}
          </svg>
        </div>
      );
    }

    function App() {
      const loadSaved = (k, def) => {
        try { const r = localStorage.getItem(k); return r ? JSON.parse(r) : def; } catch (e) { return def; }
      };

      // Estados Financeiros (Inicia Zerado no Mês 1)
      const [currentMonthNum, setCurrentMonthNum] = useState(() => loadSaved('noctis_lm_month', 1));
      const [closedMonths, setClosedMonths] = useState(() => loadSaved('noctis_lm_closed', []));
      const [transactions, setTransactions] = useState(() => loadSaved('noctis_lm_txs', []));
      const [goals, setGoals] = useState(() => loadSaved('noctis_lm_goals', [
        { id: 1, title: 'Reserva de Segurança', targetAmount: 3000 }
      ]));
      const [selectedGoalId, setSelectedGoalId] = useState(1);
      const [savingsGoalPct, setSavingsGoalPct] = useState(() => loadSaved('noctis_lm_pct', 20));

      // Inputs Financeiros
      const [txDesc, setTxDesc] = useState('');
      const [txAmount, setTxAmount] = useState('');
      const [txType, setTxType] = useState('income');
      const [txCategory, setTxCategory] = useState('Essencial');
      const [newGoalTitle, setNewGoalTitle] = useState('');
      const [newGoalTarget, setNewGoalTarget] = useState('');

      // Simulador de Investimentos
      const [simHorizonMonths, setSimHorizonMonths] = useState(12);
      const [selectedPillar, setSelectedPillar] = useState('selic');

      // Hábitos
      const [habits, setHabits] = useState(() => loadSaved('noctis_lm_habits', [
        { id: 1, title: 'Separar o valor de investimento ao receber ("Pague-se Primeiro")', category: 'Finanças', xp: 60, completed: false },
        { id: 2, title: 'Anotar gastos do dia e evitar compras por impulso', category: 'Economia', xp: 45, completed: false },
        { id: 3, title: 'Estudar 1h de Python & IA para crescer renda ativa', category: 'Carreira TI', xp: 55, completed: false }
      ]));
      const [newHabitTitle, setNewHabitTitle] = useState('');
      const [newHabitCat, setNewHabitCat] = useState('Finanças');
      const [newHabitXp, setNewHabitXp] = useState(50);

      // ⚡ CONFIGURAÇÃO DE API COM CACHE DE MODELO E STREAMING TURBO
      const [apiProvider, setApiProvider] = useState(() => localStorage.getItem('noctis_lm_provider') || 'auto');
      const [apiKey, setApiKey] = useState(() => localStorage.getItem('noctis_lm_key') || localStorage.getItem('noctis_ma_key') || '');
      const [availableModels, setAvailableModels] = useState(() => loadSaved('noctis_lm_models_list', [
        'gemini-2.5-flash-lite',
        'gemini-2.5-flash',
        'gemini-2.0-flash-lite',
        'gemini-2.0-flash'
      ]));
      const [selectedModel, setSelectedModel] = useState(() => localStorage.getItem('noctis_lm_selected_model') || '');
      const [turboMode, setTurboMode] = useState(true); // Modo Turbo ativo por padrão para respostas em <1s!
      const [lastLatencyMs, setLastLatencyMs] = useState(null);
      const [apiStatus, setApiStatus] = useState(() => localStorage.getItem('noctis_lm_selected_model') ? 'valid' : 'idle');
      const [apiStatusMsg, setApiStatusMsg] = useState('');
      const [showApiManager, setShowApiManager] = useState(false);

      // Navegação e Chat
      const [activeTab, setActiveTab] = useState('ai_analyzer');
      const [xp, setXp] = useState(() => loadSaved('noctis_lm_xp', 40));
      const [level, setLevel] = useState(() => loadSaved('noctis_lm_lvl', 1));
      const [muted, setMuted] = useState(false);
      const [chatInput, setChatInput] = useState('');
      const [isAiThinking, setIsAiThinking] = useState(false);
      const [streamingMsgId, setStreamingMsgId] = useState(null);
      const abortControllerRef = useRef(null);

      const [aiMessages, setAiMessages] = useState([
        {
          id: 1,
          sender: 'ai',
          badge: '⚡ LORDE NOCTIS — TURBO STREAMING ATIVO',
          text: 'Modo Turbo Streaming ativado! Agora eu não busco mais a lista de modelos repetidamente a cada mensagem e transmito a resposta palavra por palavra em tempo real (em menos de 1 segundo).\n\nExperimente fazer qualquer pergunta ou clicar nos módulos ao lado para sentir a diferença de velocidade!'
        }
      ]);
      const chatEndRef = useRef(null);

      // Persistência
      useEffect(() => { localStorage.setItem('noctis_lm_month', JSON.stringify(currentMonthNum)); }, [currentMonthNum]);
      useEffect(() => { localStorage.setItem('noctis_lm_closed', JSON.stringify(closedMonths)); }, [closedMonths]);
      useEffect(() => { localStorage.setItem('noctis_lm_txs', JSON.stringify(transactions)); }, [transactions]);
      useEffect(() => { localStorage.setItem('noctis_lm_goals', JSON.stringify(goals)); }, [goals]);
      useEffect(() => { localStorage.setItem('noctis_lm_pct', JSON.stringify(savingsGoalPct)); }, [savingsGoalPct]);
      useEffect(() => { localStorage.setItem('noctis_lm_habits', JSON.stringify(habits)); }, [habits]);
      useEffect(() => { localStorage.setItem('noctis_lm_xp', JSON.stringify(xp)); }, [xp]);
      useEffect(() => { localStorage.setItem('noctis_lm_lvl', JSON.stringify(level)); }, [level]);

      useEffect(() => {
        if (xp >= level * 150) {
          setXp(p => p - level * 150);
          setLevel(l => l + 1);
        }
      }, [xp, level]);

      // 🔍 Descoberta ÚNICA de Modelos (Roda apenas 1 vez ao salvar a chave, priorizando os modelos Flash mais rápidos!)
      const fetchAvailableGoogleModelsOnce = async (rawKey) => {
        const clean = (rawKey || '').replace(/["'\s]/g, '');
        if (!clean) return [];

        try {
          const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models?key=${encodeURIComponent(clean)}`);
          if (!res.ok) return [];
          const data = await res.json();

          const validTextModels = (data.models || [])
            .filter(m => {
              const methods = m.supportedGenerationMethods || [];
              const name = (m.name || '').toLowerCase();
              const isTextCapable = methods.includes('generateContent');
              const isNotSpecialOnly =
                !name.includes('embedding') &&
                !name.includes('imagen') &&
                !name.includes('veo') &&
                !name.includes('tts') &&
                !name.includes('audio') &&
                !name.includes('aqa') &&
                !name.includes('bisect') &&
                !name.includes('robotics') &&
                !name.includes('computer-use') &&
                !name.includes('image');
              return isTextCapable && isNotSpecialOnly;
            })
            .map(m => m.name.replace('models/', ''));

          // Ordena priorizando os modelos MAIS RÁPIDOS (flash-lite e flash) para latência mínima!
          validTextModels.sort((a, b) => {
            const speedScore = (name) => {
              let s = 0;
              if (name.includes('flash-lite')) s += 120; // Flash-Lite é o mais rápido de todos!
              else if (name.includes('flash')) s += 100;
              if (name.includes('2.5')) s += 25;
              else if (name.includes('3.5') || name.includes('3.8')) s += 20;
              else if (name.includes('2.0')) s += 15;
              if (name.includes('pro')) s -= 30; // Pro demora mais para raciocinar
              return s;
            };
            return speedScore(b) - speedScore(a);
          });

          if (validTextModels.length > 0) {
            setAvailableModels(validTextModels);
            localStorage.setItem('noctis_lm_models_list', JSON.stringify(validTextModels));
            const fastest = validTextModels[0];
            setSelectedModel(fastest);
            localStorage.setItem('noctis_lm_selected_model', fastest);
          }
          return validTextModels;
        } catch (e) {
          return [];
        }
      };

      // Só busca modelos ao abrir se tiver chave mas ainda não tiver modelo salvo em cache
      useEffect(() => {
        if (apiKey && !selectedModel && (apiKey.startsWith('AQ.') || apiKey.startsWith('AIza'))) {
          fetchAvailableGoogleModelsOnce(apiKey).then(list => {
            if (list.length > 0) setApiStatus('valid');
          });
        }
      }, []);

      // 📊 CÁLCULOS FINANCEIROS EM TEMPO REAL
      const currentIncome = transactions.filter(t => t.type === 'income').reduce((a, b) => a + b.amount, 0);
      const currentExpense = transactions.filter(t => t.type === 'expense').reduce((a, b) => a + b.amount, 0);
      const explicitSaved = transactions.filter(t => t.type === 'saved').reduce((a, b) => a + b.amount, 0);

      const essentialExp = transactions.filter(t => t.type === 'expense' && t.category === 'Essencial').reduce((a, b) => a + b.amount, 0);
      const variableExp = transactions.filter(t => t.type === 'expense' && t.category === 'Variável').reduce((a, b) => a + b.amount, 0);
      const superfluousExp = transactions.filter(t => t.type === 'expense' && t.category === 'Supérfluo').reduce((a, b) => a + b.amount, 0);

      const freeCashBalance = Math.max(0, currentIncome - currentExpense - explicitSaved);
      const pastAccumulated = closedMonths.reduce((acc, m) => acc + m.saved, 0);
      const totalSavedSoFar = pastAccumulated + explicitSaved;

      const currentMonthlySavePace = explicitSaved > 0
        ? explicitSaved + Math.round(freeCashBalance * 0.5)
        : Math.max(0, currentIncome - currentExpense);

      const aiCutSuperfluous = Math.round(superfluousExp * 0.5);
      const aiCutVariable = Math.round(variableExp * 0.15);
      const aiOptimizedMonthlySave = Math.max(
        currentMonthlySavePace,
        explicitSaved + freeCashBalance + aiCutSuperfluous + aiCutVariable,
        Math.round((currentIncome * savingsGoalPct) / 100)
      );

      // 🛡️ CÁLCULO DE INVESTIMENTOS SEGUROS
      const calcCompoundGrowth = (initialPrincipal, monthlyContribution, monthlyRate, months) => {
        let total = initialPrincipal;
        for (let m = 1; m <= months; m++) {
          total = total * (1 + monthlyRate) + monthlyContribution;
        }
        return Math.round(total);
      };

      const basePrincipal = totalSavedSoFar;
      const monthlyDeposit = aiOptimizedMonthlySave > 0 ? aiOptimizedMonthlySave : 300;
      const totalInvestedOutOfPocket = basePrincipal + monthlyDeposit * simHorizonMonths;

      const finalPoupanca = calcCompoundGrowth(basePrincipal, monthlyDeposit, 0.0058, simHorizonMonths);
      const finalTesouroCdb = calcCompoundGrowth(basePrincipal, monthlyDeposit, 0.0086, simHorizonMonths);
      const finalLciLca = calcCompoundGrowth(basePrincipal, monthlyDeposit, 0.0094, simHorizonMonths);

      const yieldPoupanca = Math.max(0, finalPoupanca - totalInvestedOutOfPocket);
      const yieldTesouroCdb = Math.max(0, finalTesouroCdb - totalInvestedOutOfPocket);
      const yieldLciLca = Math.max(0, finalLciLca - totalInvestedOutOfPocket);

      const buildTimeline = () => {
        const list = [];
        let runCur = 0, runAi = 0;
        closedMonths.forEach(m => {
          runCur += m.saved; runAi += m.saved;
          list.push({ label: `Mês ${m.monthNum}`, cumulativeCurrent: Math.round(runCur), cumulativeAi: Math.round(runAi), isCurrent: false });
        });
        runCur += currentMonthlySavePace;
        runAi += aiOptimizedMonthlySave;
        list.push({ label: `Mês ${currentMonthNum}`, cumulativeCurrent: Math.round(runCur), cumulativeAi: Math.round(runAi), isCurrent: true });

        let projCur = runCur, projAi = runAi;
        for (let i = 1; i <= 5; i++) {
          projCur = projCur * 1.0086 + currentMonthlySavePace;
          projAi = projAi * 1.0094 + aiOptimizedMonthlySave;
          list.push({ label: `Mês +${i}`, cumulativeCurrent: Math.round(projCur), cumulativeAi: Math.round(projAi), isCurrent: false });
        }
        return list;
      };

      const timelineData = buildTimeline();
      const activeGoal = goals.find(g => g.id === selectedGoalId) || goals[0];
      const formatBRL = (v) => Number(v || 0).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });

      // 🤖 EXTRATOR DE TRANSAÇÕES CITADAS NA CONVERSA (Executa em 0ms!)
      const extractCommandsFromChat = (text) => {
        const added = [];
        const regex = /(ganhei|recebi|gastei|paguei|comprei|guardei|investi)\s+(?:r\$\s*)?(\d+(?:[.,]\d+)?)\s*(?:reais\s*)?(?:de|em|no|na|com)?\s*([a-záéíóúâêôãõç\s]{2,25})?/gi;
        let match;
        const newItems = [];

        while ((match = regex.exec(text)) !== null) {
          const verb = match[1].toLowerCase();
          const val = parseFloat(match[2].replace(',', '.'));
          const rawDesc = (match[3] || '').trim() || (verb.includes('ganh') || verb.includes('receb') ? 'Receita' : verb.includes('guard') || verb.includes('invest') ? 'Aporte Cofre' : 'Despesa');

          if (!isNaN(val) && val > 0) {
            const type = (verb === 'ganhei' || verb === 'recebi') ? 'income' : (verb === 'guardei' || verb === 'investi') ? 'saved' : 'expense';
            const cat = type === 'income' ? 'Renda' : type === 'saved' ? 'Cofre' : autoClassifyExpense(rawDesc);
            newItems.push({
              id: Date.now() + Math.random(),
              desc: rawDesc.charAt(0).toUpperCase() + rawDesc.slice(1),
              amount: val,
              type,
              category: cat
            });
            added.push(`${type === 'income' ? '+' : type === 'saved' ? '♦' : '-'}${formatBRL(val)} (${rawDesc})`);
          }
        }

        if (newItems.length > 0) {
          setTransactions(prev => [...newItems, ...prev]);
          setXp(p => p + newItems.length * 25);
        }
        return added;
      };

      // 🚀 MOTOR DE STREAMING EM TEMPO REAL (Exibe as primeiras palavras em ~0.4s!)
      const streamAiResponse = async (keyInput, providerChoice, modelName, systemInstruction, chatHistoryArray, onChunk, signal) => {
        const cleanKey = (keyInput || '').replace(/["'\s]/g, '');
        // Envia apenas as últimas 4 mensagens para deixar o payload super leve e rápido!
        const recentMsgs = chatHistoryArray.filter(m => m.id !== 1).slice(-4);

        let resolvedProvider = providerChoice;
        if (resolvedProvider === 'auto') {
          if (!cleanKey) resolvedProvider = 'missing_key';
          else if (cleanKey.startsWith('gsk_')) resolvedProvider = 'groq';
          else if (cleanKey.startsWith('sk-or-')) resolvedProvider = 'openrouter';
          else if (cleanKey.startsWith('sk-')) resolvedProvider = 'openai';
          else resolvedProvider = 'google';
        }

        if (resolvedProvider === 'missing_key') {
          return { ok: false, error: 'Cole sua chave em "🔑 Gerenciar API" no topo direito.' };
        }

        // 1. STREAMING NATIVO DO GOOGLE GEMINI (SSE: streamGenerateContent?alt=sse)
        if (resolvedProvider === 'google' || resolvedProvider === 'gemini' || resolvedProvider === 'vertex') {
          // Se ainda não tiver modelo salvo em cache, descobre 1 única vez
          let targetModel = modelName;
          if (!targetModel) {
            const list = await fetchAvailableGoogleModelsOnce(cleanKey);
            targetModel = list[0] || 'gemini-2.5-flash';
          }

          // Constrói histórico enxuto sempre iniciando com 'user'
          const gContents = [];
          recentMsgs.forEach((m) => {
            const role = m.sender === 'user' ? 'user' : 'model';
            const textContent = (gContents.length === 0 && role === 'user')
              ? `${systemInstruction}\n\nPergunta: ${m.text}`
              : m.text;

            if (gContents.length === 0) {
              if (role === 'user') gContents.push({ role: 'user', parts: [{ text: textContent }] });
            } else {
              const last = gContents[gContents.length - 1];
              if (last.role === role) last.parts[0].text += `\n${textContent}`;
              else gContents.push({ role, parts: [{ text: textContent }] });
            }
          });

          const genConfig = {
            temperature: 0.65,
            maxOutputTokens: turboMode ? 420 : 800
          };

          // Tenta Streaming SSE Direto no modelo cacheado (Sem fila de espera!)
          try {
            const streamUrl = `https://generativelanguage.googleapis.com/v1beta/models/${targetModel}:streamGenerateContent?alt=sse&key=${encodeURIComponent(cleanKey)}`;
            const res = await fetch(streamUrl, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ contents: gContents, generationConfig: genConfig }),
              signal
            });

            if (res.ok && res.body) {
              const reader = res.body.getReader();
              const decoder = new TextDecoder('utf-8');
              let fullText = '';
              let buffer = '';

              while (true) {
                const { done, value } = await reader.read();
                if (done) break;
                buffer += decoder.decode(value, { stream: true });
                const lines = buffer.split('\n');
                buffer = lines.pop() || '';

                for (const line of lines) {
                  const trimmed = line.trim();
                  if (trimmed.startsWith('data:')) {
                    const jsonStr = trimmed.slice(5).trim();
                    if (!jsonStr || jsonStr === '[DONE]') continue;
                    try {
                      const parsed = JSON.parse(jsonStr);
                      const chunk = parsed?.candidates?.[0]?.content?.parts?.[0]?.text || '';
                      if (chunk) {
                        fullText += chunk;
                        onChunk(fullText, targetModel);
                      }
                    } catch (e) {}
                  }
                }
              }

              if (fullText.trim()) {
                return { ok: true, text: fullText, model: targetModel };
              }
            } else {
              // Se o modelo selecionado mudou na conta, atualiza a lista via ListModels uma vez e tenta o primeiro da lista
              const refreshedList = await fetchAvailableGoogleModelsOnce(cleanKey);
              const fallbackMod = refreshedList.find(m => m !== targetModel) || refreshedList[0];
              if (fallbackMod) {
                const retryRes = await fetch(
                  `https://generativelanguage.googleapis.com/v1beta/models/${fallbackMod}:generateContent?key=${encodeURIComponent(cleanKey)}`,
                  {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contents: gContents, generationConfig: genConfig }),
                    signal
                  }
                );
                const retryData = await retryRes.json();
                const retryText = retryData?.candidates?.[0]?.content?.parts?.[0]?.text;
                if (retryRes.ok && retryText) {
                  setSelectedModel(fallbackMod);
                  localStorage.setItem('noctis_lm_selected_model', fallbackMod);
                  onChunk(retryText, fallbackMod);
                  return { ok: true, text: retryText, model: fallbackMod };
                }
                return { ok: false, error: retryData?.error?.message || `HTTP ${retryRes.status}` };
              }
            }
          } catch (err) {
            if (err.name === 'AbortError') return { ok: true, aborted: true };
            return { ok: false, error: err.message };
          }
        }

        // 2. Fluxo Rápido para Groq / OpenRouter / OpenAI
        const endpointMap = {
          groq: 'https://api.groq.com/openai/v1/chat/completions',
          openrouter: 'https://openrouter.ai/api/v1/chat/completions',
          openai: 'https://api.openai.com/v1/chat/completions'
        };
        const defaultModMap = {
          groq: 'llama-3.3-70b-versatile',
          openrouter: 'google/gemini-2.0-flash-exp:free',
          openai: 'gpt-4o-mini'
        };
        const targetMod = (modelName && !modelName.startsWith('gemini')) ? modelName : defaultModMap[resolvedProvider];

        try {
          const res = await fetch(endpointMap[resolvedProvider], {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${cleanKey}` },
            body: JSON.stringify({
              model: targetMod,
              messages: [
                { role: 'system', content: systemInstruction },
                ...recentMsgs.map(m => ({ role: m.sender === 'user' ? 'user' : 'assistant', content: m.text }))
              ],
              temperature: 0.65,
              max_tokens: turboMode ? 420 : 800
            }),
            signal
          });
          const data = await res.json();
          if (res.ok && data?.choices?.[0]?.message?.content) {
            const reply = data.choices[0].message.content;
            onChunk(reply, targetMod);
            return { ok: true, text: reply, model: targetMod };
          }
          return { ok: false, error: data?.error?.message || `HTTP ${res.status}` };
        } catch (err) {
          if (err.name === 'AbortError') return { ok: true, aborted: true };
          return { ok: false, error: err.message };
        }
      };

Dados do usuário (Mês ${currentMonthNum}): Renda=${formatBRL(currentIncome)}, Gastos=${formatBRL(currentExpense)} (Essencial=${formatBRL(essentialExp)}, Variável=${formatBRL(variableExp)}, Supérfluo=${formatBRL(superfluousExp)}), Guardado=${formatBRL(totalSavedSoFar)}, Livre=${formatBRL(freeCashBalance)}, Potencial IA=${formatBRL(aiOptimizedMonthlySave)}/mês, Meta="${activeGoal?.title}"(${formatBRL(activeGoal?.targetAmount)}). Extrato: ${compactLedger}.
MODO TURBO ATIVO: Seja super direto, natural, cite os números reais e responda em no máximo 3 tópicos curtos e práticos.`

                    ...m,

                    text: `Aviso: **${res.error}**\nClique em **"⚡ Buscar Modelos & Conectar"** na barra amarela acima para sincronizar o modelo mais rápido da sua conta.`

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
