<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Noctis AI — Analisador Financeiro & Investimentos Seguros (PC)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #050508;
      color: #f8fafc;
      user-select: none;
      -webkit-user-select: none;
      overflow-x: hidden;
    }
    .font-display { font-family: 'Cinzel', serif; }

    .glass-panel {
      background: rgba(14, 14, 22, 0.82);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.75);
    }
    .glass-card {
      background: rgba(22, 22, 34, 0.65);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.07);
      transition: all 0.2s ease;
    }
    .glass-card:hover { border-color: rgba(244, 63, 94, 0.35); }

    @keyframes floatAvatar { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-5px); } }
    @keyframes spinSlow { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    .anim-float { animation: floatAvatar 4s ease-in-out infinite; }
    .anim-spin { animation: spinSlow 24s linear infinite; }

    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #09090f; }
    ::-webkit-scrollbar-thumb { background: rgba(244, 63, 94, 0.35); border-radius: 9999px; }
  </style>
</head>
<body class="min-h-screen bg-[radial-gradient(ellipse_at_top_right,_var(--tw-gradient-stops))] from-rose-950/25 via-[#07070c] to-[#030305]">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // 🔊 Efeitos Sonoros Suaves de UI
    const playSound = (type, muted) => {
      if (muted) return;
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const now = ctx.currentTime;
        const tone = (freq, start, dur, wave = 'sine', vol = 0.06) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = wave;
          osc.frequency.setValueAtTime(freq, now + start);
          gain.gain.setValueAtTime(vol, now + start);
          gain.gain.exponentialRampToValueAtTime(0.0001, now + start + dur);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(now + start);
          osc.stop(now + start + dur);
        };
        if (type === 'coin') { tone(587.33, 0, 0.12); tone(880, 0.08, 0.25); }
        else if (type === 'success') { tone(440, 0, 0.15); tone(659.25, 0.1, 0.3); }
        else if (type === 'click') { tone(520, 0, 0.05); }
      } catch (e) {}
    };

    // 🧠 Classificador NLP Automático de Gastos pelo Texto
    const autoClassifyExpense = (description) => {
      const text = description.toLowerCase();
      const superfluous = ['ifood', 'delivery', 'lanche', 'pizza', 'bar', 'festa', 'jogo', 'game', 'skin', 'streaming', 'netflix', 'shopping', 'roupa', 'doce', 'cerveja', 'assinatura', 'impulso', 'uber eats'];
      const essential = ['aluguel', 'condominio', 'condomínio', 'luz', 'energia', 'agua', 'água', 'internet', 'mercado', 'supermercado', 'feira', 'farmacia', 'farmácia', 'saude', 'saúde', 'faculdade', 'curso', 'imposto', 'iptu'];
      if (superfluous.some(k => text.includes(k))) return 'Supérfluo';
      if (essential.some(k => text.includes(k))) return 'Essencial';
      return 'Variável';
    };

    // 🧛‍♂️ Avatar Estilizado do Mentor Noctis AI
    function NoctisAvatar({ auraColor, isAnalyzing }) {
      return (
        <div className="relative w-24 h-24 mx-auto flex items-center justify-center">
          <div className="absolute inset-0 rounded-full blur-xl opacity-50" style={{ background: `radial-gradient(circle, ${auraColor} 0%, transparent 70%)` }} />
          <svg viewBox="0 0 140 140" className="absolute inset-0 w-full h-full anim-spin opacity-60">
            <circle cx="70" cy="70" r="64" fill="none" stroke={auraColor} strokeWidth="1.5" strokeDasharray="14 10" />
            <circle cx="70" cy="6" r="3" fill={auraColor} />
          </svg>
          <div className="relative w-20 h-20 rounded-full overflow-hidden border-2 border-white/15 anim-float shadow-2xl bg-[#090910]">
            <svg viewBox="0 0 120 120" className="w-full h-full">
              <circle cx="60" cy="52" r="34" fill={auraColor} opacity="0.2" />
              <path d="M 15 120 L 28 74 L 45 92 L 60 85 L 75 92 L 92 74 L 105 120 Z" fill="#14141f" />
              <path d="M 28 74 L 46 120 L 34 120 Z" fill={auraColor} opacity="0.85" />
              <path d="M 92 74 L 74 120 L 86 120 Z" fill={auraColor} opacity="0.85" />
              <polygon points="60,92 65,98 60,104 55,98" fill={auraColor} />
              <path d="M 40 42 C 40 26 80 26 80 42 C 80 64 68 78 60 82 C 52 78 40 64 40 42 Z" fill="#e2e8f0" />
              <path d="M 36 48 C 34 25 50 18 60 18 C 72 18 86 25 84 48 C 81 36 74 30 66 34 C 62 28 52 30 46 38 C 42 35 38 40 36 48 Z" fill="#1e293b" />
              <path d="M 38 42 C 42 26 56 22 68 24 C 58 28 48 34 44 45 Z" fill="#f8fafc" opacity="0.85" />
              <path d="M 45 51 Q 50 48 56 52 Q 50 55 45 51 Z" fill="#09090f" />
              <circle cx="50.5" cy="51.5" r="2.4" fill={auraColor} />
              <path d="M 64 52 Q 70 48 75 51 Q 70 55 64 52 Z" fill="#09090f" />
              <circle cx="69.5" cy="51.5" r="2.4" fill={auraColor} />
              {isAnalyzing ? (
                <g>
                  <path d="M 54 67 Q 60 72 66 67 Q 60 75 54 67 Z" fill="#881337" />
                  <polygon points="56,68 57.5,71.5 59,68" fill="#ffffff" />
                  <polygon points="61,68 62.5,71.5 64,68" fill="#ffffff" />
                </g>
              ) : (
                <path d="M 55 68 Q 60 70.5 65 68" fill="none" stroke="#475569" strokeWidth="1.6" strokeLinecap="round" />
              )}
            </svg>
          </div>
        </div>
      );
    }

    // 📊 Gráfico Dinâmico de Evolução e Projeção com Juros Seguros
    function DynamicProjectionChart({ timelineData, activeGoal, formatBRL }) {
      const maxDataVal = Math.max(
        ...timelineData.map(d => Math.max(d.cumulativeCurrent, d.cumulativeAi)),
        activeGoal?.targetAmount || 1000,
        500
      ) * 1.15;

      const goalY = activeGoal
        ? Math.max(18, Math.min(168, 170 - (activeGoal.targetAmount / maxDataVal) * 145))
        : null;

      return (
        <div className="w-full">
          <div className="flex flex-wrap items-center justify-between gap-2 mb-3">
            <div>
              <h3 className="text-sm font-bold text-white">
                📈 Curva de Acúmulo Patrimonial (Ritmo Atual vs. Otimizado pela IA + Rendimento CDI)
              </h3>
              <p className="text-xs text-zinc-400">
                Começa do seu Mês 1 e projeta os próximos 5 meses somando seus aportes + rendimento seguro da Renda Fixa
              </p>
            </div>
            <div className="flex flex-wrap items-center gap-4 text-xs font-semibold">
              <span className="flex items-center gap-1.5 text-amber-300">
                <span className="w-3 h-2 rounded-sm bg-amber-400 inline-block" /> Acúmulo Atual
              </span>
              <span className="flex items-center gap-1.5 text-emerald-400">
                <span className="w-3 h-2 rounded-sm bg-emerald-400 inline-block" /> Plano IA + Renda Fixa
              </span>
              {activeGoal && (
                <span className="flex items-center gap-1.5 text-rose-400">
                  <span className="w-3 h-0.5 border-t-2 border-dashed border-rose-500 inline-block" /> Marca: {activeGoal.title}
                </span>
              )}
            </div>
          </div>

          <div className="relative w-full h-60 bg-zinc-950/80 rounded-2xl border border-white/10 p-4">
            <svg viewBox="0 0 720 200" className="w-full h-full overflow-visible">
              {[0, 0.25, 0.5, 0.75, 1].map((step, i) => {
                const y = 170 - step * 145;
                const val = Math.round(maxDataVal * step);
                return (
                  <g key={i}>
                    <line x1="55" y1={y} x2="695" y2={y} stroke="rgba(255,255,255,0.06)" strokeDasharray="4 4" />
                    <text x="48" y={y + 3} textAnchor="end" fill="#71717a" fontSize="9" fontWeight="600">
                      R$ {val >= 1000 ? `${(val / 1000).toFixed(1)}k` : val}
                    </text>
                  </g>
                );
              })}

              {activeGoal && goalY !== null && (
                <g>
                  <line x1="55" y1={goalY} x2="695" y2={goalY} stroke="#f43f5e" strokeWidth="1.8" strokeDasharray="6 4" />
                  <rect x="550" y={goalY - 16} width="145" height="14" rx="4" fill="#881337" />
                  <text x="622" y={goalY - 6} textAnchor="middle" fill="#fecdd3" fontSize="8.5" fontWeight="800">
                    🎯 {activeGoal.title}: {formatBRL(activeGoal.targetAmount)}
                  </text>
                </g>
              )}

              {timelineData.map((item, idx) => {
                const stepWidth = 620 / Math.max(1, timelineData.length);
                const groupX = 75 + idx * stepWidth;
                const curBarH = Math.max(3, (item.cumulativeCurrent / maxDataVal) * 145);
                const aiBarH = Math.max(3, (item.cumulativeAi / maxDataVal) * 145);

                return (
                  <g key={idx}>
                    <rect x={groupX - 14} y={170 - curBarH} width="13" height={curBarH} rx="3" fill={item.isCurrent || item.isHistory ? "#f59e0b" : "#f59e0b88"} />
                    <rect x={groupX + 2} y={170 - aiBarH} width="13" height={aiBarH} rx="3" fill={item.isCurrent || item.isHistory ? "#10b981" : "#10b98199"} />
                    <text x={groupX} y={Math.max(12, 165 - Math.max(curBarH, aiBarH))} textAnchor="middle" fill="#a7f3d0" fontSize="8.5" fontWeight="700">
                      R${item.cumulativeAi >= 1000 ? `${(item.cumulativeAi / 1000).toFixed(1)}k` : item.cumulativeAi}
                    </text>
                    <text x={groupX} y="188" textAnchor="middle" fill={item.isCurrent ? "#fda4af" : "#a1a1aa"} fontSize="9.5" fontWeight={item.isCurrent ? "800" : "600"}>
                      {item.label}
                    </text>
                  </g>
                );
              })}
            </svg>
          </div>
        </div>
      );
    }

    function App() {
      const loadSaved = (k, def) => {
        try { const r = localStorage.getItem(k); return r ? JSON.parse(r) : def; } catch (e) { return def; }
      };

      // Estados do Ciclo Financeiro (Começa Zerado no Mês 1)
      const [currentMonthNum, setCurrentMonthNum] = useState(() => loadSaved('noctis_v3_month', 1));
      const [closedMonths, setClosedMonths] = useState(() => loadSaved('noctis_v3_closed', []));
      const [transactions, setTransactions] = useState(() => loadSaved('noctis_v3_txs', []));
      const [goals, setGoals] = useState(() => loadSaved('noctis_v3_goals', [
        { id: 1, title: 'Reserva de Emergência', targetAmount: 3000 }
      ]));
      const [selectedGoalId, setSelectedGoalId] = useState(1);
      const [savingsGoalPct, setSavingsGoalPct] = useState(() => loadSaved('noctis_v3_pct', 20));

      // Inputs Financeiros
      const [txDesc, setTxDesc] = useState('');
      const [txAmount, setTxAmount] = useState('');
      const [txType, setTxType] = useState('income');
      const [txCategory, setTxCategory] = useState('Essencial');
      const [newGoalTitle, setNewGoalTitle] = useState('');
      const [newGoalTarget, setNewGoalTarget] = useState('');

      // Simulador de Investimentos Seguros
      const [simHorizonMonths, setSimHorizonMonths] = useState(12); // 6, 12, 24, 36 meses

      // Estados de Hábitos Financeiros
      const [habits, setHabits] = useState(() => loadSaved('noctis_v3_habits', [
        { id: 1, title: 'Separar o valor de investimento no dia do pagamento ("Pague-se Primeiro")', xp: 60, completed: false },
        { id: 2, title: 'Anotar 100% dos gastos do dia e revisar supérfluos', xp: 45, completed: false },
        { id: 3, title: 'Estudar 1h de Python / IA para aumentar minha renda ativa', xp: 55, completed: false }
      ]));

      // Estados da Chave API Gratuita do Google AI Studio
      const [geminiKey, setGeminiKey] = useState(() => localStorage.getItem('noctis_v3_api_key') || '');
      const [apiStatus, setApiStatus] = useState(() => localStorage.getItem('noctis_v3_api_key') ? 'configured' : 'none'); // 'none' | 'testing' | 'valid' | 'error'
      const [apiStatusMsg, setApiStatusMsg] = useState('');
      const [showApiWizard, setShowApiWizard] = useState(false);

      // Navegação e Chat IA
      const [activeTab, setActiveTab] = useState('ai_analyzer'); // Começa direto no Analisador IA & Configurador para te ajudar!
      const [xp, setXp] = useState(() => loadSaved('noctis_v3_xp', 0));
      const [level, setLevel] = useState(() => loadSaved('noctis_v3_lvl', 1));
      const [muted, setMuted] = useState(false);
      const [chatInput, setChatInput] = useState('');
      const [isAiThinking, setIsAiThinking] = useState(false);
      const [aiMessages, setAiMessages] = useState([
        {
          id: 1,
          sender: 'ai',
          text: 'Saudações! Sou Lorde Noctis, seu Analisador Financeiro e Mentor de Investimentos Seguros. Cole sua chave gratuita do Google AI Studio no painel ao lado (ou use meu motor analítico nativo) e clique em um dos botões de auditoria para eu te ensinar a cortar gastos e multiplicar sua grana guardada com segurança total!'
        }
      ]);
      const chatEndRef = useRef(null);

      useEffect(() => { localStorage.setItem('noctis_v3_month', JSON.stringify(currentMonthNum)); }, [currentMonthNum]);
      useEffect(() => { localStorage.setItem('noctis_v3_closed', JSON.stringify(closedMonths)); }, [closedMonths]);
      useEffect(() => { localStorage.setItem('noctis_v3_txs', JSON.stringify(transactions)); }, [transactions]);
      useEffect(() => { localStorage.setItem('noctis_v3_goals', JSON.stringify(goals)); }, [goals]);
      useEffect(() => { localStorage.setItem('noctis_v3_pct', JSON.stringify(savingsGoalPct)); }, [savingsGoalPct]);
      useEffect(() => { localStorage.setItem('noctis_v3_habits', JSON.stringify(habits)); }, [habits]);

      // 📊 CÁLCULOS FINANCEIROS EM TEMPO REAL
      const currentIncome = transactions.filter(t => t.type === 'income').reduce((a, b) => a + b.amount, 0);
      const currentExpense = transactions.filter(t => t.type === 'expense').reduce((a, b) => a + b.amount, 0);
      const explicitSaved = transactions.filter(t => t.type === 'saved').reduce((a, b) => a + b.amount, 0);

      const essentialExp = transactions.filter(t => t.type === 'expense' && t.category === 'Essencial').reduce((a, b) => a + b.amount, 0);
      const variableExp = transactions.filter(t => t.type === 'expense' && t.category === 'Variável').reduce((a, b) => a + b.amount, 0);
      const superfluousExp = transactions.filter(t => t.type === 'expense' && t.category === 'Supérfluo').reduce((a, b) => a + b.amount, 0);

      const freeCashBalance = Math.max(0, currentIncome - currentExpense - explicitSaved);
      const pastAccumulated = closedMonths.reduce((acc, m) => acc + m.saved, 0);
      const totalSavedSoFar = pastAccumulated + explicitSaved;

      // Quanto você junta hoje vs. Quanto pode juntar com os cortes da IA
      const currentMonthlySavePace = explicitSaved > 0
        ? explicitSaved + Math.round(freeCashBalance * 0.5)
        : Math.max(0, currentIncome - currentExpense);

      const aiCutSuperfluous = Math.round(superfluousExp * 0.5);
      const aiCutVariable = Math.round(variableExp * 0.15);
      const aiOptimizedMonthlySave = Math.max(
        currentMonthlySavePace,
        explicitSaved + freeCashBalance + aiCutSuperfluous + aiCutVariable,
        Math.round((currentIncome * savingsGoalPct) / 100)
      );

      // 🛡️ CÁLCULO DE INVESTIMENTOS SEGUROS (Juros Compostos Mensais Reais)
      // Taxas líquidas aproximadas mensais:
      // 1. Poupança Comum: ~0,58% ao mês (isenta, mas perde p/ inflação/Selic)
      // 2. Tesouro Selic / CDB 100% CDI (líquido de IR): ~0,86% ao mês
      // 3. LCI / LCA 92% CDI ou CDB 110% CDI (isento de IR, garantido pelo FGC): ~0,94% ao mês
      const calcCompoundGrowth = (initialPrincipal, monthlyContribution, monthlyRate, months) => {
        let total = initialPrincipal;
        for (let m = 1; m <= months; m++) {
          total = total * (1 + monthlyRate) + monthlyContribution;
        }
        return Math.round(total);
      };

      const basePrincipal = totalSavedSoFar;
      const monthlyDeposit = aiOptimizedMonthlySave > 0 ? aiOptimizedMonthlySave : 300; // Se estiver zerado, simula com R$ 300/mês para ensinar o usuário!
      const totalInvestedOutOfPocket = basePrincipal + monthlyDeposit * simHorizonMonths;

      const finalPoupanca = calcCompoundGrowth(basePrincipal, monthlyDeposit, 0.0058, simHorizonMonths);
      const finalTesouroCdb = calcCompoundGrowth(basePrincipal, monthlyDeposit, 0.0086, simHorizonMonths);
      const finalLciLca = calcCompoundGrowth(basePrincipal, monthlyDeposit, 0.0094, simHorizonMonths);

      const yieldPoupanca = Math.max(0, finalPoupanca - totalInvestedOutOfPocket);
      const yieldTesouroCdb = Math.max(0, finalTesouroCdb - totalInvestedOutOfPocket);
      const yieldLciLca = Math.max(0, finalLciLca - totalInvestedOutOfPocket);

      // Linha do Tempo para o Gráfico
      const buildTimeline = () => {
        const list = [];
        let runCur = 0;
        let runAi = 0;
        closedMonths.forEach(m => {
          runCur += m.saved;
          runAi += m.saved;
          list.push({ label: `Mês ${m.monthNum}`, cumulativeCurrent: Math.round(runCur), cumulativeAi: Math.round(runAi), isHistory: true, isCurrent: false });
        });
        runCur += currentMonthlySavePace;
        runAi += aiOptimizedMonthlySave;
        list.push({ label: `Mês ${currentMonthNum} (Atual)`, cumulativeCurrent: Math.round(runCur), cumulativeAi: Math.round(runAi), isHistory: false, isCurrent: true });

        let projCur = runCur;
        let projAi = runAi;
        for (let i = 1; i <= 5; i++) {
          projCur = projCur * 1.0086 + currentMonthlySavePace;
          projAi = projAi * 1.0094 + aiOptimizedMonthlySave;
          list.push({ label: `Mês +${i}`, cumulativeCurrent: Math.round(projCur), cumulativeAi: Math.round(projAi), isHistory: false, isCurrent: false });
        }
        return list;
      };

      const timelineData = buildTimeline();
      const activeGoal = goals.find(g => g.id === selectedGoalId) || goals[0];
      const formatBRL = (v) => Number(v || 0).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });

      // 🔌 FUNÇÃO PARA CHAMAR A CHAVE DE API DO GOOGLE GEMINI (Testa gemini-2.5-flash e gemini-1.5-flash automaticamente)
      const callGeminiApi = async (keyToUse, promptText) => {
        const models = ['gemini-2.5-flash', 'gemini-2.0-flash', 'gemini-1.5-flash'];
        for (const modelName of models) {
          try {
            const response = await fetch(
              `https://generativelanguage.googleapis.com/v1beta/models/${modelName}:generateContent?key=${keyToUse.trim()}`,
              {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                  contents: [{ parts: [{ text: promptText }] }],
                  generationConfig: { temperature: 0.65, maxOutputTokens: 650 }
                })
              }
            );
            if (response.ok) {
              const data = await response.json();
              const text = data?.candidates?.[0]?.content?.parts?.[0]?.text;
              if (text) return { ok: true, text, model: modelName };
            }
          } catch (err) {
            // Tenta o próximo modelo da lista em caso de falha
          }
        }
        return { ok: false, text: null };
      };

      // Testar se a Chave API está funcionando de verdade
      const handleTestApiKey = async () => {
        if (!geminiKey.trim()) {
          setApiStatus('error');
          setApiStatusMsg('Cole uma chave começando com AIzaSy... antes de testar.');
          return;
        }
        setApiStatus('testing');
        setApiStatusMsg('Conectando aos servidores do Google AI Studio...');
        localStorage.setItem('noctis_v3_api_key', geminiKey.trim());

        const result = await callGeminiApi(
          geminiKey,
          'Responda apenas com uma frase curta em português como Lorde Noctis confirmando que a conexão da chave API para análise financeira está ativa.'
        );

        if (result.ok) {
          playSound('success', muted);
          setApiStatus('valid');
          setApiStatusMsg(`Chave validada com sucesso no modelo ${result.model}!`);
          setAiMessages(prev => [...prev, { id: Date.now(), sender: 'ai', text: `🟢 Conexão API Confirmada (${result.model}): ${result.text}` }]);
        } else {
          setApiStatus('error');
          setApiStatusMsg('Não foi possível validar a chave. Verifique se copiou sem espaços do Google AI Studio (aistudio.google.com). O motor local continuará funcionando normalmente!');
        }
      };

      // 🧠 GERADOR LOCAL DE ANÁLISE FINANCEIRA E INVESTIMENTOS SEGUROS (Funciona mesmo sem internet/API)
      const generateExpertLocalAnalysis = (topic) => {
        const t = topic.toLowerCase();
        if (t.includes('invest') || t.includes('multiplicar') || t.includes('segur') || t.includes('renda fixa') || t.includes('selic') || t.includes('cdb')) {
          return `🛡️ GUIA DE INVESTIMENTOS SEGUROS PARA SUA GRANA (${formatBRL(totalSavedSoFar)} guardados + potencial de ${formatBRL(monthlyDeposit)}/mês):
1️⃣ 1º Passo — Reserva de Liquidez Diária (Segurança Máxima): Coloque os primeiros valores no **Tesouro Selic** (garantido pelo Tesouro Nacional) ou em um **CDB de Liquidez Diária que pague 100% do CDI** em um banco sólido (protegido pelo **FGC** até R$ 250 mil). Nunca deixe parado na conta corrente ou na Poupança antiga!
2️⃣ 2º Passo — Aceleração Isenta de Imposto (LCI e LCA): Para o dinheiro que você não vai precisar pelos próximos 9 a 12 meses, aplique em **LCI ou LCA (90% a 95% do CDI)**. Como são isentas de Imposto de Renda para pessoa física e têm garantia do FGC, elas rendem mais que um CDB comum!
3️⃣ Resultado Prático: Em ${simHorizonMonths} meses aportando ${formatBRL(monthlyDeposit)}/mês, você acumulará **${formatBRL(finalLciLca)}** (ganhando **+${formatBRL(yieldLciLca)} só de juros seguros**, contra apenas ${formatBRL(yieldPoupanca)} na Poupança!).`;
        }

        if (t.includes('poupar') || t.includes('corte') || t.includes('economizar') || t.includes('gast')) {
          if (currentIncome === 0 && currentExpense === 0) {

                        value={chatInput}
                        onChange={e => setChatInput(e.target.value)}
                        className="flex-1 bg-zinc-950 border border-white/15 rounded-xl px-4 py-2.5 text-xs text-white focus:outline-none focus:border-rose-500"
                      />
                      <button
                        type="submit"
                        className="bg-rose-600 hover:bg-rose-500 text-white font-bold text-xs px-5 py-2.5 rounded-xl transition"
                      >
                        Analisar
                      </button>
                    </form>
                  </div>

                </div>
              )}

              {/* ABA 2: SIMULADOR DE INVESTIMENTOS SEGUROS (MULTIPLICADOR DE GRANA GUARDADA) */}
              {activeTab === 'safe_invest' && (
                <div className="space-y-6">
                  <div className="glass-card p-6 rounded-3xl space-y-5">
                    <div className="flex flex-wrap items-center justify-between gap-4">
                      <div>
                        <h3 className="text-base font-extrabold text-white">
                          🛡️ Simulador de Renda Fixa Segura: Quanto Sua Grana Guardada Vai Render?
                        </h3>
                        <p className="text-xs text-zinc-400">
                          Cálculo real baseado no seu saldo guardado ({formatBRL(basePrincipal)}) + aporte mensal de {formatBRL(monthlyDeposit)}/mês
                        </p>
                      </div>

                      <div className="flex items-center gap-1.5 bg-zinc-950 p-1.5 rounded-xl border border-white/10">
                        <span className="text-xs font-bold text-zinc-400 px-2">Prazo:</span>
                        {[6, 12, 24, 36].map(m => (
                          <button
                            key={m}
                            onClick={() => setSimHorizonMonths(m)}
                            className={`px-3 py-1 rounded-lg text-xs font-bold transition ${
                              simHorizonMonths === m ? 'bg-emerald-600 text-white' : 'text-zinc-400 hover:text-white'
                            }`}
                          >
                            {m} meses
                          </button>
                        ))}
                      </div>
                    </div>

                    {/* Comparativo das 3 Opções Seguras */}
                    <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                      <div className="p-5 rounded-2xl bg-zinc-950/80 border border-white/10 space-y-2">
                        <div className="flex justify-between items-center">
                          <span className="text-xs font-bold text-zinc-400 uppercase">1. Poupança Antiga</span>
                          <span className="text-[10px] px-2 py-0.5 rounded bg-zinc-800 text-zinc-400">~0,58% a.m.</span>
                        </div>
                        <div className="text-2xl font-extrabold text-zinc-200">{formatBRL(finalPoupanca)}</div>
                        <div className="text-xs text-zinc-400">
                          Total saído do bolso: {formatBRL(totalInvestedOutOfPocket)}<br />
                          <strong className="text-amber-300">Rendimento de Juros: +{formatBRL(yieldPoupanca)}</strong>
                        </div>
                      </div>

                      <div className="p-5 rounded-2xl bg-zinc-950/90 border border-sky-500/40 space-y-2">
                        <div className="flex justify-between items-center">
                          <span className="text-xs font-bold text-sky-400 uppercase">2. Tesouro Selic / CDB 100%</span>
                          <span className="text-[10px] px-2 py-0.5 rounded bg-sky-500/20 text-sky-300 font-bold">Liquidez Diária</span>
                        </div>
                        <div className="text-2xl font-extrabold text-white">{formatBRL(finalTesouroCdb)}</div>
                        <div className="text-xs text-zinc-300">
                          Garantia FGC / Tesouro Nacional<br />
                          <strong className="text-sky-300">Rendimento Líquido: +{formatBRL(yieldTesouroCdb)}</strong>
                        </div>
                      </div>

                      <div className="p-5 rounded-2xl bg-gradient-to-br from-emerald-950/60 to-zinc-950 border-2 border-emerald-500/50 space-y-2">
                        <div className="flex justify-between items-center">
                          <span className="text-xs font-bold text-emerald-300 uppercase">3. LCI / LCA (Isento de IR)</span>
                          <span className="text-[10px] px-2 py-0.5 rounded bg-emerald-500/20 text-emerald-300 font-bold">Maior Retorno</span>
                        </div>
                        <div className="text-2xl font-extrabold text-emerald-400">{formatBRL(finalLciLca)}</div>
                        <div className="text-xs text-emerald-100/90">
                          Zero Imposto de Renda + Proteção FGC<br />
                          <strong className="text-emerald-300">Rendimento Livre: +{formatBRL(yieldLciLca)} (+{formatBRL(yieldLciLca - yieldPoupanca)} vs Poupança!)</strong>
                        </div>
                      </div>
                    </div>
                  </div>
                </div>
              )}

              {/* ABA 3: LIVRO CAIXA, MARCAS & GRÁFICO DE PROJEÇÃO */}
              {activeTab === 'dashboard' && (
                <div className="space-y-6">
                  <div className="glass-card p-5 rounded-3xl">
                    <DynamicProjectionChart timelineData={timelineData} activeGoal={activeGoal} formatBRL={formatBRL} />

                    {/* Criador de Marcas */}
                    <div className="mt-4 pt-4 border-t border-white/10 flex flex-wrap items-center justify-between gap-4">
                      <div className="flex flex-wrap items-center gap-2">
                        <span className="text-xs font-bold text-zinc-300">🎯 Marcas Ativas:</span>
                        {goals.map(g => (
                          <button
                            key={g.id}
                            onClick={() => setSelectedGoalId(g.id)}
                            className={`px-3 py-1.5 rounded-xl text-xs font-bold border transition ${
                              selectedGoalId === g.id ? 'bg-rose-600 text-white border-rose-400' : 'bg-zinc-900 text-zinc-400 border-white/10'
                            }`}
                          >
                            {g.title}: {formatBRL(g.targetAmount)}
                          </button>
                        ))}
                      </div>

                      <form
                        onSubmit={e => {
                          e.preventDefault();
                          const val = parseFloat(String(newGoalTarget).replace(',', '.'));
                          if (!newGoalTitle.trim() || isNaN(val) || val <= 0) return;
                          const ng = { id: Date.now(), title: newGoalTitle.trim(), targetAmount: val };
                          setGoals([...goals, ng]);
                          setSelectedGoalId(ng.id);
                          setNewGoalTitle('');
                          setNewGoalTarget('');
                        }}
                        className="flex gap-2"
                      >
                        <input
                          type="text"
                          placeholder="Nova Marca..."
                          value={newGoalTitle}
                          onChange={e => setNewGoalTitle(e.target.value)}
                          className="bg-zinc-950 border border-white/10 rounded-xl px-3 py-1.5 text-xs text-white"
                        />
                        <input
                          type="number"
                          placeholder="R$ Valor"
                          value={newGoalTarget}
                          onChange={e => setNewGoalTarget(e.target.value)}
                          className="w-28 bg-zinc-950 border border-white/10 rounded-xl px-3 py-1.5 text-xs text-white"
                        />
                        <button type="submit" className="bg-rose-600 text-white font-bold text-xs px-3.5 py-1.5 rounded-xl">
                          + Marca
                        </button>
                      </form>
                    </div>
                  </div>

                  {/* Lançamento + Lista */}
                  <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
                    <div className="glass-card p-5 rounded-3xl space-y-3">
                      <h3 className="text-sm font-bold text-white">➕ Registrar Ganho, Gasto ou Poupança</h3>
                      <form onSubmit={handleAddTransaction} className="space-y-3">
                        <div className="grid grid-cols-3 gap-1.5">
                          {[
                            { id: 'income', label: '+ Ganhei', cls: 'bg-emerald-600 text-white' },
                            { id: 'expense', label: '- Gastei', cls: 'bg-rose-600 text-white' },
                            { id: 'saved', label: '♦ Guardei', cls: 'bg-amber-500 text-zinc-950' }
                          ].map(b => (
                            <button
                              key={b.id}
                              type="button"
                              onClick={() => setTxType(b.id)}
                              className={`py-2 rounded-xl text-xs font-bold ${txType === b.id ? b.cls : 'bg-zinc-900 text-zinc-400'}`}
                            >
                              {b.label}
                            </button>
                          ))}
                        </div>
                        <input
                          type="text"
                          placeholder="Descrição (Ex: Salário, iFood, Aluguel...)"
                          value={txDesc}
                          onChange={e => {
                            setTxDesc(e.target.value);
                            if (txType === 'expense') setTxCategory(autoClassifyExpense(e.target.value));
                          }}
                          className="w-full bg-zinc-950 border border-white/10 rounded-xl px-3.5 py-2 text-xs text-white"
                        />
                        <div className="flex gap-2">
                          <input
                            type="number"
                            step="0.01"
                            placeholder="R$ Valor"
                            value={txAmount}
                            onChange={e => setTxAmount(e.target.value)}
                            className="flex-1 bg-zinc-950 border border-white/10 rounded-xl px-3.5 py-2 text-xs text-white"
                          />
                          {txType === 'expense' && (
                            <select
                              value={txCategory}
                              onChange={e => setTxCategory(e.target.value)}
                              className="bg-zinc-950 border border-white/10 rounded-xl px-3 py-2 text-xs text-white"
                            >
                              <option value="Essencial">Essencial</option>
                              <option value="Variável">Variável</option>
                              <option value="Supérfluo">Supérfluo</option>
                            </select>
                          )}
                          <button type="submit" className="bg-rose-600 text-white font-bold text-xs px-5 py-2 rounded-xl">
                            Salvar
                          </button>
                        </div>
                      </form>
                    </div>

                    <div className="glass-card p-5 rounded-3xl max-h-72 overflow-y-auto space-y-2">
                      <h3 className="text-sm font-bold text-white mb-2">📑 Lançamentos do Mês {currentMonthNum}</h3>
                      {transactions.length === 0 ? (
                        <p className="text-xs text-zinc-500 py-8 text-center">Nenhum lançamento ainda. Adicione ao lado ou clique em "Preencher Dados de Exemplo" na barra lateral!</p>
                      ) : (
                        transactions.map(tx => (
                          <div key={tx.id} className="p-2.5 rounded-xl bg-zinc-950 border border-white/5 flex justify-between items-center">
                            <div>
                              <span className="text-xs font-bold text-white block">{tx.desc}</span>
                              <span className="text-[10px] text-zinc-400">{tx.category}</span>
                            </div>
                            <span className={`text-xs font-extrabold ${tx.type === 'expense' ? 'text-rose-400' : 'text-emerald-400'}`}>
                              {tx.type === 'expense' ? '-' : '+'}{formatBRL(tx.amount)}
                            </span>
                          </div>
                        ))
                      )}
                    </div>
                  </div>
                </div>
              )}

              {/* ABA 4: HÁBITOS DE RIQUEZA */}
              {activeTab === 'habits' && (
                <div className="glass-card p-5 rounded-3xl space-y-3">
                  <h3 className="text-sm font-bold text-white">🎯 Rituais Diários para Acumular Patrimônio</h3>
                  {habits.map(h => (
                    <div key={h.id} className="p-3.5 rounded-2xl bg-zinc-950 border border-white/10 flex items-center justify-between">
                      <div className="flex items-center gap-3">
                        <button
                          onClick={() => {
                            playSound('success', muted);
                            setHabits(habits.map(i => i.id === h.id ? { ...i, completed: !i.completed } : i));
                            if (!h.completed) setXp(p => p + h.xp);
                          }}
                          className={`w-9 h-9 rounded-xl font-bold text-xs ${h.completed ? 'bg-emerald-500/20 text-emerald-400' : 'bg-rose-500/15 text-rose-400'}`}
                        >
                          {h.completed ? '✓' : '♦'}
                        </button>
                        <span className={`text-xs font-bold ${h.completed ? 'line-through text-zinc-500' : 'text-white'}`}>{h.title}</span>
                      </div>
                      <span className="text-xs font-bold text-rose-400">+{h.xp} XP</span>
                    </div>
                  ))}
                </div>
              )}

            </div>
          </main>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
