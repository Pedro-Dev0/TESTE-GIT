<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Barbearia Davi</title>

  <!-- ========================================== -->
  <!-- CONFIGURAÇÕES DE PWA (TELA DO CELULAR)     -->
  <!-- ========================================== -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="DaviBarber">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#09090b"> <!-- Cor preta no topo do celular -->
  
  <!-- Ícone que vai aparecer na tela do cliente -->
  <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/3011/3011270.png">
  <link rel="icon" type="image/png" href="https://cdn-icons-png.flaticon.com/512/3011/3011270.png">

  <!-- ========================================== -->
  <!-- ESTILOS E FONTES                           -->
  <!-- ========================================== -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; }
    .esconder-scroll::-webkit-scrollbar { display: none; }
    .esconder-scroll { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-gray-100 antialiased flex justify-center sm:items-center min-h-screen">

  <div class="bg-gray-50 w-full sm:max-w-[400px] sm:h-[850px] sm:max-h-[90vh] sm:rounded-[2.5rem] sm:shadow-2xl overflow-hidden relative flex flex-col sm:border-[8px] sm:border-gray-900">
    
    <!-- TELA 1: AGENDAMENTO -->
    <div id="tela-agendamento" class="flex flex-col h-full w-full">
      <div class="bg-zinc-950 px-6 pt-12 pb-8 rounded-b-[2rem] shadow-lg z-10">
        <h1 class="text-2xl font-extrabold text-white tracking-tight">Barbearia do Davi</h1>
        <p class="text-zinc-400 text-sm mt-1 font-medium">Agendamento Rápido</p>
      </div>

      <div class="flex-1 overflow-y-auto esconder-scroll p-6 pb-32 space-y-8">
        <div>
          <h2 class="text-[1.1rem] font-bold text-gray-800 mb-4 flex items-center gap-2">
            <span class="bg-zinc-200 text-zinc-800 w-6 h-6 rounded-full flex items-center justify-center text-xs">1</span> Escolha o Serviço
          </h2>
          <div class="flex flex-col gap-3">
            <button onclick="selecionarServico('Corte Clássico', 35, this)" class="btn-servico touch-manipulation flex justify-between items-center p-4 rounded-2xl border-2 border-transparent bg-white shadow-sm hover:shadow-md active:scale-[0.98] transition-all text-left">
              <span class="font-semibold text-gray-800 text-lg">Corte Clássico</span>
              <span class="font-extrabold text-zinc-900">R$ 35</span>
            </button>
            <button onclick="selecionarServico('Barba na Navalha', 25, this)" class="btn-servico touch-manipulation flex justify-between items-center p-4 rounded-2xl border-2 border-transparent bg-white shadow-sm hover:shadow-md active:scale-[0.98] transition-all text-left">
              <span class="font-semibold text-gray-800 text-lg">Barba na Navalha</span>
              <span class="font-extrabold text-zinc-900">R$ 25</span>
            </button>
            <button onclick="selecionarServico('Combo (Corte + Barba)', 55, this)" class="btn-servico touch-manipulation flex justify-between items-center p-4 rounded-2xl border-2 border-transparent bg-white shadow-sm hover:shadow-md active:scale-[0.98] transition-all text-left">
              <span class="font-semibold text-gray-800 text-lg">Combo (Corte + Barba)</span>
              <span class="font-extrabold text-zinc-900">R$ 55</span>
            </button>
          </div>
        </div>

        <div>
          <h2 class="text-[1.1rem] font-bold text-gray-800 mb-4 flex items-center gap-2">
            <span class="bg-zinc-200 text-zinc-800 w-6 h-6 rounded-full flex items-center justify-center text-xs">2</span> Horários de Hoje
          </h2>
          <div class="grid grid-cols-3 gap-3">
            <button onclick="selecionarHorario('14:00', this)" class="btn-horario touch-manipulation py-3.5 rounded-xl font-bold border-2 border-transparent bg-white shadow-sm text-gray-500 active:scale-95 transition-all">14:00</button>
            <button onclick="selecionarHorario('15:20', this)" class="btn-horario touch-manipulation py-3.5 rounded-xl font-bold border-2 border-transparent bg-white shadow-sm text-gray-500 active:scale-95 transition-all">15:20</button>
            <button onclick="selecionarHorario('16:40', this)" class="btn-horario touch-manipulation py-3.5 rounded-xl font-bold border-2 border-transparent bg-white shadow-sm text-gray-500 active:scale-95 transition-all">16:40</button>
          </div>
        </div>
      </div>

      <div class="absolute bottom-0 w-full bg-gradient-to-t from-gray-50 via-gray-50 to-transparent pt-6 pb-6 px-6">
        <button id="btn-confirmar" onclick="fazerAgendamento()" class="w-full bg-zinc-200 text-zinc-400 font-bold text-lg py-4 rounded-2xl shadow-lg transition-all flex justify-center items-center cursor-not-allowed" disabled>
          Falta escolher
        </button>
      </div>
    </div>

    <!-- TELA 2: SUCESSO -->
    <div id="tela-sucesso" class="hidden flex-col h-full w-full bg-white">
      <div class="bg-green-500 p-10 pt-20 flex flex-col items-center justify-center text-center rounded-b-[3rem] shadow-xl">
        <div class="bg-white w-20 h-20 rounded-full flex items-center justify-center mb-5 shadow-2xl scale-110">
          <svg class="w-10 h-10 text-green-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="4" d="M5 13l4 4L19 7"></path></svg>
        </div>
        <h1 class="text-3xl font-extrabold text-white tracking-tight">Agendado!</h1>
      </div>
      <div class="p-6 flex-1 flex flex-col justify-center">
        <button onclick="mudarTela('tela-admin')" class="w-full bg-zinc-950 hover:bg-black text-white text-lg font-bold py-4 rounded-2xl shadow-xl active:scale-95 transition-all animate-bounce">
          Acessar Painel do Davi
        </button>
      </div>
    </div>

    <!-- TELA 3: ADMIN -->
    <div id="tela-admin" class="hidden flex-col h-full w-full bg-gray-50 relative">
      <div class="bg-zinc-950 p-6 pt-12 rounded-b-[2rem] shadow-lg z-10 flex justify-between items-center">
        <div>
          <p class="text-zinc-400 text-xs font-semibold uppercase tracking-wider mb-1">Painel de Controle</p>
          <h1 class="text-2xl font-extrabold text-white" id="titulo-admin">Sua Agenda</h1>
        </div>
        <button onclick="mudarTela('tela-agendamento')" class="bg-zinc-800 text-white p-3 rounded-full shadow-md active:scale-90 transition-all">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
        </button>
      </div>

      <!-- ABA AGENDA -->
      <div id="aba-agenda" class="flex-1 overflow-y-auto esconder-scroll p-4 pb-28 space-y-4"></div>

      <!-- ABA DASHBOARD -->
      <div id="aba-dashboard" class="hidden flex-1 overflow-y-auto esconder-scroll p-6 pb-28 space-y-6">
        <div class="bg-white rounded-[1.5rem] p-6 shadow-sm border border-gray-100 relative overflow-hidden">
          <p class="text-sm text-gray-500 font-bold mb-1">Ganhos de Hoje</p>
          <h3 class="text-4xl font-extrabold text-green-500" id="dash-lucro-diario">R$ 0,00</h3>
        </div>
        <div class="bg-zinc-950 rounded-[1.5rem] p-6 shadow-xl relative overflow-hidden">
          <p class="text-sm text-zinc-400 font-bold mb-1">Acumulado do Mês</p>
          <h3 class="text-4xl font-extrabold text-white mb-3" id="dash-lucro-mensal">R$ 0,00</h3>
        </div>
      </div>

      <!-- NAV INFERIOR -->
      <div class="absolute bottom-0 w-full bg-white border-t border-gray-100 flex justify-around px-2 pt-3 pb-8 sm:pb-4 shadow-[0_-10px_30px_rgba(0,0,0,0.05)] rounded-t-3xl z-20">
        <button onclick="alternarAbaAdmin('agenda')" id="btn-nav-agenda" class="flex flex-col items-center p-2 text-zinc-950 active:scale-90 transition-all">
          <svg class="w-7 h-7 mb-1" fill="currentColor" viewBox="0 0 24 24"><path d="M19 4h-1V2h-2v2H8V2H6v2H5c-1.11 0-1.99.9-1.99 2L3 20a2 2 0 002 2h14c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 16H5V10h14v10zM5 8V6h14v2H5z"/></svg>
          <span class="text-[11px] font-bold">Agenda</span>
        </button>
        <button onclick="alternarAbaAdmin('dashboard')" id="btn-nav-dash" class="flex flex-col items-center p-2 text-gray-300 hover:text-zinc-950 active:scale-90 transition-all">
          <svg class="w-7 h-7 mb-1" fill="currentColor" viewBox="0 0 24 24"><path d="M16 11V3H8v6H2v12h20V11h-6zm-6-6h4v14h-4V5zm-6 6h4v8H4v-8zm16 8h-4v-6h4v6z"/></svg>
          <span class="text-[11px] font-bold">Finanças</span>
        </button>
      </div>
    </div>
  </div>

  <script>
    let servicoEscolhido = null, precoEscolhido = 0, horarioEscolhido = null, nomeCliente = "";
    let agendaBancoDeDados = [{ hora: '09:00', nome: 'Marcos Paulo', servico: 'Corte Clássico', valor: 35, status: 'passado' }, { hora: '10:30', nome: 'Lucas Ferreira', servico: 'Barba na Navalha', valor: 25, status: 'passado' }];

    function selecionarServico(nome, preco, botao) {
      servicoEscolhido = nome; precoEscolhido = preco;
      document.querySelectorAll('.btn-servico').forEach(btn => btn.className = 'btn-servico touch-manipulation flex justify-between items-center p-4 rounded-2xl border-2 border-transparent bg-white shadow-sm active:scale-[0.98] transition-all text-left');
      botao.className = 'btn-servico touch-manipulation flex justify-between items-center p-4 rounded-2xl border-2 border-zinc-950 bg-zinc-50 shadow-md active:scale-[0.98] transition-all text-left scale-[1.02]';
      verificarSePodeAgendar();
    }
    function selecionarHorario(hora, botao) {
      horarioEscolhido = hora;
      document.querySelectorAll('.btn-horario').forEach(btn => btn.className = 'btn-horario touch-manipulation py-3.5 rounded-xl font-bold border-2 border-transparent bg-white shadow-sm text-gray-500 active:scale-95 transition-all');
      botao.className = 'btn-horario touch-manipulation py-3.5 rounded-xl font-bold border-2 border-zinc-950 bg-zinc-950 text-white active:scale-95 transition-all shadow-md scale-105';
      verificarSePodeAgendar();
    }
    function verificarSePodeAgendar() {
      const btn = document.getElementById('btn-confirmar');
      if (servicoEscolhido && horarioEscolhido) {
        btn.disabled = false; btn.innerHTML = `Confirmar ${horarioEscolhido}`;
        btn.className = 'w-full bg-zinc-950 text-white font-extrabold text-lg py-4 rounded-2xl shadow-xl shadow-zinc-900/30 active:scale-95 transition-all flex justify-center items-center cursor-pointer';
      }
    }
    function fazerAgendamento() {
      nomeCliente = prompt("Digite seu nome (Simulação):"); if (!nomeCliente) return;
      agendaBancoDeDados.push({ hora: horarioEscolhido, nome: nomeCliente, servico: servicoEscolhido, valor: precoEscolhido, status: 'novo' });
      agendaBancoDeDados.sort((a, b) => a.hora.localeCompare(b.hora));
      mudarTela('tela-sucesso');
    }
    function atualizarDadosAdmin() {
      let totalDiario = 0; const lista = document.getElementById('aba-agenda'); lista.innerHTML = ''; 
      agendaBancoDeDados.forEach(item => {
        totalDiario += item.valor; let ehNovo = item.status === 'novo';
        let bgClass = ehNovo ? 'bg-white border-2 border-green-500 shadow-lg scale-[1.02] z-10' : 'bg-white border border-gray-100 shadow-sm opacity-90';
        let badge = ehNovo ? `<div class="absolute -top-3 -right-2 bg-green-500 text-white text-[10px] font-black uppercase px-3 py-1 rounded-full shadow-md animate-pulse">Novo</div>` : '';
        lista.innerHTML += `<div class="flex items-center gap-4 p-4 rounded-2xl ${bgClass} relative transition-all">${badge}<div class="text-center w-14 border-r-2 border-gray-100 pr-3 py-2"><p class="text-xl font-extrabold text-zinc-900">${item.hora}</p></div><div class="flex-1 pl-1"><p class="font-bold text-gray-900 text-lg">${item.nome}</p><p class="text-xs text-gray-500 font-semibold mt-1">${item.servico}</p></div><div class="text-right bg-gray-50 px-3 py-2 rounded-xl border border-gray-100"><p class="font-extrabold text-green-600 text-sm">R$ ${item.valor}</p></div></div>`;
      });
      document.getElementById('dash-lucro-diario').innerText = `R$ ${totalDiario},00`;
      document.getElementById('dash-lucro-mensal').innerText = `R$ ${(3850 + totalDiario).toLocaleString('pt-BR', {minimumFractionDigits: 2})}`;
    }
    function alternarAbaAdmin(aba) {
      document.getElementById('aba-agenda').classList.add('hidden'); document.getElementById('aba-dashboard').classList.add('hidden');
      document.getElementById('btn-nav-agenda').classList.replace('text-zinc-950', 'text-gray-300'); document.getElementById('btn-nav-dash').classList.replace('text-zinc-950', 'text-gray-300');
      if (aba === 'agenda') { document.getElementById('aba-agenda').classList.remove('hidden'); document.getElementById('btn-nav-agenda').classList.replace('text-gray-300', 'text-zinc-950'); document.getElementById('titulo-admin').innerText = 'Sua Agenda'; } 
      else { document.getElementById('aba-dashboard').classList.remove('hidden'); document.getElementById('btn-nav-dash').classList.replace('text-gray-300', 'text-zinc-950'); document.getElementById('titulo-admin').innerText = 'Seu Financeiro'; }
    }
    function mudarTela(telaId) {
      document.getElementById('tela-agendamento').classList.add('hidden'); document.getElementById('tela-agendamento').classList.remove('flex');
      document.getElementById('tela-sucesso').classList.add('hidden'); document.getElementById('tela-sucesso').classList.remove('flex');
      document.getElementById('tela-admin').classList.add('hidden'); document.getElementById('tela-admin').classList.remove('flex');
      if (telaId === 'tela-admin') { atualizarDadosAdmin(); alternarAbaAdmin('agenda'); }
      document.getElementById(telaId).classList.remove('hidden'); document.getElementById(telaId).classList.add('flex');
    }
  </script>
</body>
</html>
